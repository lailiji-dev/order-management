# V4 application traffic requires HTTPS; certificate challenges remain available.
set $peiliao_https_redirect 0;
if ($scheme = http) { set $peiliao_https_redirect 1; }
if ($uri ~ ^/\.well-known/acme-challenge/) { set $peiliao_https_redirect 0; }
if ($peiliao_https_redirect = 1) { return 308 https://YOUR_APP_DOMAIN$request_uri; }
gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_static on;
include /www/server/nginx/conf/peiliao-security-headers.conf;
location = /api/auth/login {
    client_max_body_size 16k;
    include /www/server/nginx/conf/peiliao-security-proxy.conf;
}
location ^~ /api/ {
    client_max_body_size 4m;
    include /www/server/nginx/conf/peiliao-security-proxy.conf;
}
location ^~ /assets/ {
    if ($uri !~ \.(?:js|css|svg|png|woff2?)$) { return 404; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /www/server/nginx/conf/peiliao-security-headers.conf;
}
location = / { try_files /index.html =404; add_header Cache-Control "no-store" always; include /www/server/nginx/conf/peiliao-security-headers.conf; }
location = /index.html { try_files $uri =404; add_header Cache-Control "no-store" always; include /www/server/nginx/conf/peiliao-security-headers.conf; }
location = /peiliao.html { try_files $uri =404; add_header Cache-Control "no-store" always; include /www/server/nginx/conf/peiliao-security-headers.conf; }
location = /admin.html { try_files $uri =404; add_header Cache-Control "no-store" always; include /www/server/nginx/conf/peiliao-security-headers.conf; }
location = /favicon.svg { try_files $uri =404; include /www/server/nginx/conf/peiliao-security-headers.conf; }
# Compatibility for an already-open v2 page; only this one named legacy file.
location = /shared.js { try_files $uri =404; add_header Cache-Control "no-store" always; include /www/server/nginx/conf/peiliao-security-headers.conf; }
location / { return 404; }
