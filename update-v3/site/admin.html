<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单管理后台</title><link rel="icon" href="/favicon.svg?v=20261003-v3" type="image/svg+xml">
<link rel="stylesheet" href="/admin.css?v=20261003-v3">
<script defer src="/admin.js?v=20261003-v3"></script>
</head><body><main>
<section class="login" id="loginPanel"><h1>订单管理后台</h1><p class="muted">管理员登录后管理员工账号和查看订单新增人</p><form id="loginForm"><label for="username">管理员账号</label><input id="username" value="root" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" id="loginButton">登录</button><div class="error" id="loginError" role="alert"></div></form><a href="/">返回订单系统</a></section>
<div id="dashboard" class="hidden"><header><h1>订单管理后台</h1><div class="tools"><span id="adminName"></span><a href="/">订单系统</a><button id="refresh">刷新</button><button id="logout">退出</button></div></header><div id="message" class="error" role="alert"></div>
<section><h2>员工账号</h2><form id="createUser" class="form-row"><div><label for="newUsername">登录账号</label><input id="newUsername" pattern="[A-Za-z0-9_.\-]{2,50}" placeholder="如 zhangsan" required></div><div><label for="newName">员工姓名</label><input id="newName" maxlength="100" required></div><div><label for="newPassword">初始密码（至少 7 位）</label><input id="newPassword" type="password" minlength="7" autocomplete="new-password" required></div><button class="primary" type="submit">新增员工</button></form><p class="muted">员工使用自己的账号登录订单系统。停用账号会立即结束其登录会话。</p><div class="scroll"><table><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section><h2>订单新增人记录</h2><div class="tools"><label class="sr-only" for="orderSearch">搜索订单</label><input type="search" id="orderSearch" placeholder="搜索订单号、日期、员工或客户"><span id="orderCount" class="muted" role="status"></span><span id="ordersBusy" class="muted" role="status"></span></div><p class="muted">新增人仅在后台展示。历史订单标明合并账号，其原始新增人无法追溯。</p><div class="scroll"><table><thead><tr><th>订单号</th><th>取货日期</th><th>状态</th><th>产品</th><th>客户</th><th>金额 / 定金</th><th>新增员工</th></tr></thead><tbody id="orders"></tbody></table></div><div class="tools pager"><button type="button" id="ordersPrevious" disabled>上一页</button><button type="button" id="ordersNext" disabled>下一页</button><span class="muted">每页 100 笔，搜索覆盖所有订单</span></div></section>
<section><h2>最近操作记录</h2><div class="scroll"><table><thead><tr><th>时间</th><th>账号</th><th>操作</th><th>订单号</th></tr></thead><tbody id="audit"></tbody></table></div></section></div>
</main><dialog id="resetDialog"><form id="resetForm"><h2 id="resetTitle">重置员工密码</h2><input id="resetUsername" autocomplete="username" hidden><label for="resetPassword">新密码（至少 7 位）</label><input id="resetPassword" type="password" minlength="7" required autocomplete="new-password"><div class="tools"><button type="submit" class="primary">保存</button><button type="button" id="resetCancel">取消</button></div><p id="resetError" class="error"></p></form></dialog>
</body></html>
