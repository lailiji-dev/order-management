# Include inside Nginx's http context; configure placeholders before use.
log_format order_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
map $uri $order_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name YOUR_APP_DOMAIN;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/order-management/public;
        try_files $uri =404;
    }
    location / { return 308 https://YOUR_APP_DOMAIN$request_uri; }
}

server {
    listen 443 ssl;
    server_name YOUR_APP_DOMAIN;
    ssl_certificate YOUR_CERTIFICATE_PATH;
    ssl_certificate_key YOUR_PRIVATE_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/order-management/public;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_static on;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $order_cache_control always;
    access_log /var/log/nginx/order-management.access.log order_private;

    location = /api/auth/login {
        client_max_body_size 16k;
        include /opt/order-management/config/proxy.conf;
    }
    location ^~ /api/ {
        client_max_body_size 4m;
        include /opt/order-management/config/proxy.conf;
    }
    location ^~ /assets/ {
        if ($uri !~ \.(?:js|css|svg|png|woff2?)$) { return 404; }
        try_files $uri =404;
    }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /peiliao.html { try_files $uri =404; }
    location = /admin.html { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location / { return 404; }
}
