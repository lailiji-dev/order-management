<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单管理后台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8ee;color:#41362e;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}.hidden{display:none!important}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font-size:26px;color:#a84914}h2{font-size:19px}a{color:#a84914}button,input{font:inherit}button{padding:9px 16px;border:1px solid #dfbba2;border-radius:9px;background:#fff;cursor:pointer;color:#88441d}button.primary{background:#bf5d26;color:white;border:0}button:disabled{opacity:.55;cursor:wait}input{padding:10px;border:1px solid #dbc9ba;border-radius:9px;max-width:100%}label{display:block;color:#786454;font-size:13px}section{background:#fff;border:1px solid #ead8c8;border-radius:16px;padding:20px;margin-top:20px}.form-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.form-row input{width:220px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #f0e2d6}th{font-size:13px;color:#856950}td.wrap{white-space:normal;min-width:160px;max-width:330px}.muted{font-size:13px;color:#90745f}.error{color:#bd3428;min-height:24px}.login{max-width:420px;margin:12vh auto;padding:28px}.login input{width:100%;margin:6px 0 16px}.login button{width:100%}.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.badge{background:#fff0dc;border-radius:7px;padding:3px 8px;font-size:12px}dialog{border:1px solid #dfbba2;border-radius:14px;padding:24px;width:min(400px,90vw)}dialog::backdrop{background:#41362e70}dialog input{width:100%;margin:8px 0 18px}
</style></head><body><main>
<section class="login" id="loginPanel"><h1>订单管理后台</h1><p class="muted">管理员登录后管理员工账号和查看订单新增人</p><form id="loginForm"><label for="username">管理员账号</label><input id="username" value="root" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" id="loginButton">登录</button><div class="error" id="loginError" role="alert"></div></form><a href="/">返回订单系统</a></section>
<div id="dashboard" class="hidden"><header><h1>订单管理后台</h1><div class="tools"><span id="adminName"></span><a href="/">订单系统</a><button id="refresh">刷新</button><button id="logout">退出</button></div></header><div id="message" class="error" role="alert"></div>
<section><h2>员工账号</h2><form id="createUser" class="form-row"><div><label for="newUsername">登录账号</label><input id="newUsername" pattern="[A-Za-z0-9_.\-]{2,50}" placeholder="如 zhangsan" required></div><div><label for="newName">员工姓名</label><input id="newName" maxlength="100" required></div><div><label for="newPassword">初始密码（至少 7 位）</label><input id="newPassword" type="password" minlength="7" autocomplete="new-password" required></div><button class="primary" type="submit">新增员工</button></form><p class="muted">员工使用自己的账号登录订单系统。停用账号会立即结束其登录会话。</p><div class="scroll"><table><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section><h2>订单新增人记录</h2><div class="tools"><input id="orderSearch" placeholder="搜索订单号、日期、员工或客户"><span id="orderCount" class="muted"></span></div><p class="muted">新增人仅在后台展示。历史订单标明合并账号，其原始新增人无法追溯。</p><div class="scroll"><table><thead><tr><th>订单号</th><th>取货日期</th><th>状态</th><th>产品</th><th>客户</th><th>金额 / 定金</th><th>新增员工</th></tr></thead><tbody id="orders"></tbody></table></div></section>
<section><h2>最近操作记录</h2><div class="scroll"><table><thead><tr><th>时间</th><th>账号</th><th>操作</th><th>订单号</th></tr></thead><tbody id="audit"></tbody></table></div></section></div>
</main><dialog id="resetDialog"><form id="resetForm"><h2 id="resetTitle">重置员工密码</h2><label for="resetPassword">新密码（至少 7 位）</label><input id="resetPassword" type="password" minlength="7" required autocomplete="new-password"><div class="tools"><button type="submit" class="primary">保存</button><button type="button" id="resetCancel">取消</button></div><p id="resetError" class="error"></p></form></dialog>
<script>
'use strict';var session=null,allOrders=[],allUsers=[],resetUser=null;
function escapeText(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
async function api(path,data){var options={credentials:'same-origin',cache:'no-store',headers:{}};if(data!==undefined){options.method='POST';options.headers['Content-Type']='application/json';options.headers['X-CSRF-Token']=session?session.csrf:'';options.body=JSON.stringify(data);}var response=await fetch('/api/'+path,options),body=await response.json();if(!response.ok){var error=new Error(body.error||'请求失败');error.status=response.status;throw error;}return body;}
function message(text){document.getElementById('message').textContent=text;}
function hide(){session=null;document.getElementById('dashboard').classList.add('hidden');document.getElementById('loginPanel').classList.remove('hidden');}
async function activate(auth){session=auth;if(auth.user.role!=='admin'){hide();throw new Error('此账号没有管理员权限，请返回订单系统。');}await refresh();document.getElementById('adminName').textContent=auth.user.displayName;document.getElementById('dashboard').classList.remove('hidden');document.getElementById('loginPanel').classList.add('hidden');}
function renderOrders(){var query=document.getElementById('orderSearch').value.trim().toLowerCase(),orders=allOrders.filter(function(o){return [o.orderNo,o.legacyOrderNo,o.orderDate,o.creator,o.creatorUsername,o.customerName,o.phone].join(' ').toLowerCase().includes(query);});document.getElementById('orderCount').textContent=orders.length+' 笔订单';document.getElementById('orders').innerHTML=orders.sort(function(a,b){return Number(b.orderNo)-Number(a.orderNo);}).map(function(o){return '<tr><td>'+escapeText(o.orderNo)+(o.legacyOrderNo?'<div class="muted">原 '+escapeText(o.legacyOrderNo)+'</div>':'')+'</td><td>'+escapeText(o.orderDate)+'</td><td>'+ (o.cancelled?'已取消':o.status==='picked'?'已取货':'未取')+(o.earlyPickup?' <span class="badge">★早取</span>':'')+'</td><td class="wrap">'+o.items.map(function(it){return escapeText(it.productName)+' × '+it.quantity;}).join('、')+'</td><td>'+escapeText(o.customerName||'—')+'<div class="muted">'+escapeText(o.phone||'')+'</div></td><td>¥'+(o.orderAmount/100).toFixed(2)+' / ¥'+Math.round(o.deposit/100)+'</td><td>'+escapeText(o.creator)+'<div class="muted">'+escapeText(o.creatorUsername)+(o.imported?' · 历史合并':'')+'</div></td></tr>';}).join('')||'<tr><td colspan="7" class="muted">暂无订单</td></tr>';}
async function refresh(){message('');var replies=await Promise.all([api('admin/users'),api('admin/orders'),api('admin/audit')]);allUsers=replies[0].users;allOrders=replies[1].orders;document.getElementById('users').innerHTML=allUsers.map(function(u){return '<tr><td>'+escapeText(u.username)+'</td><td>'+escapeText(u.displayName)+'</td><td>'+(u.role==='admin'?'管理员':'员工')+'</td><td>'+(u.enabled?'可用':'已停用')+'</td><td>'+(u.role==='admin'?'<span class="muted">在订单系统修改密码</span>':'<button data-toggle="'+u.id+'">'+(u.enabled?'停用':'启用')+'</button> <button data-reset="'+u.id+'">重置密码</button>')+'</td></tr>';}).join('');renderOrders();document.getElementById('audit').innerHTML=replies[2].audit.map(function(row){return '<tr><td>'+escapeText(new Date(row.occurred_at).toLocaleString('zh-CN'))+'</td><td>'+escapeText(row.username)+'</td><td>'+escapeText(row.action)+'</td><td>'+escapeText(row.order_no||'—')+'</td></tr>';}).join('')||'<tr><td colspan="4" class="muted">暂无操作记录</td></tr>';}
document.getElementById('loginForm').addEventListener('submit',async function(event){event.preventDefault();var button=document.getElementById('loginButton');button.disabled=true;try{await activate(await api('auth/login',{username:document.getElementById('username').value.trim(),password:document.getElementById('password').value}));document.getElementById('password').value='';}catch(error){document.getElementById('loginError').textContent=error.message;}finally{button.disabled=false;}});
document.getElementById('createUser').addEventListener('submit',async function(event){event.preventDefault();var button=event.target.querySelector('button');button.disabled=true;try{await api('admin/users',{username:document.getElementById('newUsername').value.trim(),displayName:document.getElementById('newName').value.trim(),password:document.getElementById('newPassword').value});event.target.reset();await refresh();message('员工账号已创建。');}catch(error){message(error.message);}finally{button.disabled=false;}});
document.getElementById('users').addEventListener('click',async function(event){var button=event.target.closest('button');if(!button)return;var id=Number(button.dataset.toggle||button.dataset.reset),user=allUsers.find(function(u){return u.id===id;});if(!user)return;if(button.dataset.reset){resetUser=user;document.getElementById('resetTitle').textContent='重置 '+user.displayName+' 的密码';document.getElementById('resetPassword').value='';document.getElementById('resetError').textContent='';document.getElementById('resetDialog').showModal();return;}button.disabled=true;try{await api('admin/users/update',{id:id,enabled:!user.enabled});await refresh();}catch(error){message(error.message);button.disabled=false;}});
document.getElementById('resetForm').addEventListener('submit',async function(event){event.preventDefault();try{await api('admin/users/update',{id:resetUser.id,enabled:resetUser.enabled,password:document.getElementById('resetPassword').value});document.getElementById('resetDialog').close();await refresh();}catch(error){document.getElementById('resetError').textContent=error.message;}});
document.getElementById('resetCancel').onclick=function(){document.getElementById('resetDialog').close();};
document.getElementById('orderSearch').addEventListener('input',renderOrders);
document.getElementById('refresh').onclick=async function(){try{await refresh();}catch(error){message(error.message);if(error.status===401)hide();}};
document.getElementById('logout').onclick=async function(){try{await api('auth/logout',{});hide();}catch(error){message(error.message);}};
api('auth/me').then(activate).catch(function(error){hide();if(error.status!==401)document.getElementById('loginError').textContent=error.message;});
</script></body></html>
