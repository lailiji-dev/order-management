name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_id:
        description: '回滚到的 deployment id（留空 = 正常部署最新提交）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 部署或回滚
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.rollback_id }}" ]; then
            echo "🔁 回滚到 ${{ github.event.inputs.rollback_id }}"
            npx wrangler pages deployment rollback "${{ github.event.inputs.rollback_id }}" --project-name=peiliao
          else
            echo "🚀 部署最新提交"
            npx wrangler pages deploy site --project-name=peiliao --branch=main
          fi

      - name: 健康检查
        if: ${{ !github.event.inputs.rollback_id }}
        run: node scripts/healthcheck.mjs https://peiliao.pages.dev
