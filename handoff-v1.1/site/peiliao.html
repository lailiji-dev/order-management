<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生产配料计算系统</title>
<style>
  /* ============ 设计 Token（橙主色 · 食品厂） ============ */
  :root{
    /* 主色：食品厂橙 */
    --orange-50:#FFF1E8;  --orange-100:#FFE0CC; --orange-200:#FFC299;
    --orange-300:#FFA866; --orange-400:#FF8A33; --orange-500:#FF6A00;
    --orange-600:#E85F00; --orange-700:#C44F00; --orange-800:#A34100;
    /* 状态色 */
    --green-50:#E7F6EC;  --green-100:#C6E9D2; --green-400:#27AE60; --green-500:#1FA352; --green-600:#15803D; --green-700:#0F612E;
    --danger:#D92B2B;     --danger-bg:#FDECEC; --danger-soft:#FBDADA;
    --info:#1C7ED6;       --info-bg:#E7F1FB;
    /* 中性 */
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FBFCFD;
    --text:#1E2530; --text-2:#3A4452; --muted:#6B7280;
    --line:#E7E9ED; --line-strong:#D6DAE0;
    /* 圆角 / 阴影 / 间距 */
    --r-sm:10px; --r:14px; --r-lg:18px;
    --sh-sm:0 1px 2px rgba(40,30,20,.06),0 1px 3px rgba(40,30,20,.05);
    --sh:0 2px 6px rgba(40,30,20,.08),0 1px 2px rgba(40,30,20,.04);
    --sh-lg:0 10px 28px rgba(60,40,20,.18);
    --sp:8px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.55;
    padding-bottom:84px;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;}
  .hidden{display:none !important;}

  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
    outline:3px solid var(--orange-200);outline-offset:2px;border-radius:6px;
  }

  /* ============ 顶部标题 ============ */
  .app-header{
    background:linear-gradient(135deg,var(--orange-500),var(--orange-700));
    color:#fff;padding:16px 18px;position:sticky;top:0;z-index:20;
    box-shadow:0 3px 10px rgba(120,60,10,.20);
    display:flex;align-items:center;gap:12px;
  }
  .app-header .logo{
    width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;
  }
  .app-header .ht{display:flex;flex-direction:column;line-height:1.2;}
  .app-header h1{font-size:18px;font-weight:700;letter-spacing:.5px;}
  .app-header .sub{font-size:12px;opacity:.9;margin-top:2px;}

  /* ============ 视图容器 ============ */
  .view{max-width:880px;margin:0 auto;padding:14px 14px 8px;}

  /* ============ 通用按钮 ============ */
  .btn{
    border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;
    cursor:pointer;transition:transform .12s ease,box-shadow .15s ease,filter .15s ease,background .15s;
    flex:1 1 auto;min-width:118px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;font-size:17px;padding:15px 18px;box-shadow:0 4px 12px rgba(255,106,0,.35);flex-basis:100%;}
  .btn-primary:hover{box-shadow:0 6px 16px rgba(255,106,0,.42);}
  .btn-secondary{background:#fff;color:var(--orange-700);border:2px solid var(--orange-200);}
  .btn-secondary:hover{background:var(--orange-50);}
  .btn-ghost{background:#EEF0F3;color:var(--text-2);}
  .btn-ghost:hover{background:#E4E7EC;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#BC2020;}
  .btn-info{background:var(--info);color:#fff;}
  .btn-info:hover{background:#1869B8;}
  .btn-success{background:var(--green-500);color:#fff;}
  .btn-success:hover{background:var(--green-600);}
  .btn-sm{padding:8px 13px;font-size:13px;min-width:auto;flex:0 0 auto;border-radius:10px;}
  .btn-block{flex-basis:100%;}
  .divider{width:100%;height:1px;background:var(--line);margin:4px 0;}

  /* ============ 订单模块：顶部 Tab ============ */
  .order-top{max-width:880px;margin:0 auto;padding:14px 14px 0;}
  .order-tabs{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--sh-sm);}
  .order-tab{
    flex:1;border:none;background:none;padding:11px 8px;border-radius:10px;font-size:15px;font-weight:800;
    color:var(--muted);cursor:pointer;transition:all .15s;font-family:inherit;
  }
  .order-tab.active{background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;box-shadow:var(--sh-sm);}

  /* 统计头 */
  .stat-card{
    background:linear-gradient(180deg,#fff,#FFF9F4);border:1px solid var(--line);
    border-left:5px solid var(--orange-500);border-radius:var(--r);padding:14px 16px;margin:12px 0;box-shadow:var(--sh);
  }
  .stat-date{font-size:18px;font-weight:800;}
  .stat-lunar{color:var(--muted);font-size:13px;margin-top:2px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
  .stat-cell{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;}
  .stat-cell .v{font-size:19px;font-weight:800;color:var(--orange-700);line-height:1.2;}
  .stat-cell .v.green{color:var(--green-600);}
  .stat-cell .v.gray{color:var(--muted);}
  .stat-cell .k{font-size:11px;color:var(--muted);margin-top:2px;}

  .section-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px;}
  .section-bar h2{font-size:17px;font-weight:800;color:var(--text);}
  .link-btn{background:none;border:none;color:var(--orange-600);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;padding:4px 6px;}

  /* ============ 订单卡片 ============ */
  .order-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
    margin-bottom:12px;box-shadow:var(--sh-sm);border-left:5px solid var(--orange-400);
  }
  .order-card.picked{border-left-color:var(--green-500);}
  .order-card.cancelled{opacity:.62;border-left-color:var(--danger);}
  .oc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .oc-no{font-weight:800;font-size:15px;letter-spacing:.3px;}
  .oc-items{display:flex;flex-direction:column;gap:3px;margin:6px 0;}
  .oc-item{display:flex;align-items:baseline;justify-content:space-between;font-size:14px;color:var(--text-2);}
  .oc-item .nm{flex:1;}
  .oc-item .qty{font-weight:700;color:var(--text);white-space:nowrap;}
  .oc-money{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin:8px 0 4px;font-size:13px;}
  .oc-money .row{display:flex;justify-content:space-between;}
  .oc-money .row .lbl{color:var(--muted);}
  .oc-money .row .val{font-weight:700;}
  .oc-money .row .val.amt{color:var(--orange-700);font-size:15px;}
  .oc-money .row .val.rem{color:var(--danger);}
  .oc-note{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text-2);margin:6px 0;white-space:pre-wrap;word-break:break-all;}
  .oc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}

  .badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:800;}
  .badge.unpicked{background:var(--orange-50);color:var(--orange-700);border:1px solid var(--orange-200);}
  .badge.picked{background:var(--green-50);color:var(--green-600);border:1px solid var(--green-100);}
  .badge.cancelled{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-soft);}
  .badge-count{background:var(--orange-100);color:var(--orange-800);font-weight:800;font-size:12px;padding:2px 9px;border-radius:20px;}

  .empty-tip{color:var(--muted);font-size:14px;padding:24px 8px;text-align:center;}

  /* ============ 月历 ============ */
  .cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--sh-sm);margin-bottom:12px;}
  .cal-title{font-size:17px;font-weight:800;}
  .cal-nav{display:flex;gap:8px;align-items:center;}
  .cal-nav button{border:none;background:var(--orange-50);color:var(--orange-700);font-weight:800;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px;font-family:inherit;}
  .cal-nav button:hover{background:var(--orange-100);}
  .cal-grid{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--sh);}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0;}
  .cal-week span:first-child,.cal-week span:last-child{color:var(--orange-500);}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{
    position:relative;min-height:60px;border:1px solid var(--line);border-radius:10px;padding:5px 4px;
    background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    transition:all .12s;font-family:inherit;
  }
  .cal-cell:hover{background:var(--orange-50);}
  .cal-cell.out{opacity:.35;}
  .cal-cell.today{border:2px solid var(--orange-500);background:#FFF7F0;}
  .cal-cell.has{background:#FFF3EA;border-color:var(--orange-200);}
  .cal-cell .d{font-size:15px;font-weight:800;line-height:1.3;}
  .cal-cell .l{font-size:10px;color:var(--muted);line-height:1.1;margin-top:1px;}
  .cal-cell .n{font-size:10px;font-weight:800;color:var(--orange-700);margin-top:2px;}
  .cal-cell.today .d{color:var(--orange-600);}

  /* ============ 全屏覆盖视图 ============ */
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;}
  .ov-top{
    background:linear-gradient(135deg,var(--orange-500),var(--orange-700));color:#fff;
    padding:13px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;
    box-shadow:0 3px 10px rgba(120,60,10,.20);
  }
  .ov-top h2{font-size:17px;font-weight:700;flex:1;}
  .ov-back{border:none;background:rgba(255,255,255,.18);color:#fff;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;transition:background .15s;}
  .ov-back:hover{background:rgba(255,255,255,.28);}
  .ov-body{max-width:880px;margin:0 auto;padding:16px 14px 30px;}

  /* 表单 */
  .field{margin-bottom:14px;}
  .field > label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:var(--text-2);}
  .field .req{color:var(--danger);}
  input[type=text],input[type=number],input[type=date],textarea,select{
    border:2px solid var(--line-strong);border-radius:11px;padding:12px 13px;font-size:16px;width:100%;
    outline:none;background:var(--surface-2);color:var(--text);transition:border-color .15s,background .15s;font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--orange-400);background:#fff;}
  textarea{resize:vertical;min-height:74px;line-height:1.5;}

  /* 日期选择块 */
  .date-pick{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface-2);border:2px solid var(--line-strong);border-radius:12px;padding:12px 14px;cursor:pointer;
  }
  .date-pick:active{background:#fff;}
  .date-pick .dp-main{font-size:17px;font-weight:800;}
  .date-pick .dp-lunar{font-size:12px;color:var(--muted);margin-top:2px;}
  .date-pick .dp-edit{color:var(--orange-600);font-weight:800;font-size:14px;white-space:nowrap;}

  /* 产品录入行 */
  .prod-edit-list{display:flex;flex-direction:column;gap:10px;}
  .pe-group-title{font-weight:800;font-size:15px;color:var(--orange-700);margin:14px 0 4px;display:flex;align-items:center;justify-content:space-between;}
  .pe-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--sh-sm);}
  .pe-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pe-name{font-weight:700;font-size:15px;flex:1;}
  .pe-price{font-size:12px;color:var(--muted);}
  .pe-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
  .stepper{display:flex;align-items:center;gap:0;background:var(--surface-2);border:2px solid var(--line-strong);border-radius:12px;overflow:hidden;}
  .stepper button{width:42px;height:42px;border:none;background:none;font-size:22px;font-weight:800;color:var(--orange-700);cursor:pointer;font-family:inherit;}
  .stepper button:hover{background:var(--orange-50);}
  .stepper input{border:none;background:transparent;width:64px;text-align:center;font-size:20px;font-weight:800;color:var(--text);outline:none;-moz-appearance:textfield;}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .pe-sub{font-size:13px;color:var(--text-2);white-space:nowrap;text-align:right;}
  .pe-sub b{color:var(--orange-700);font-size:14px;}

  .amount-box{background:linear-gradient(180deg,#FFFDF9,#FFF4E9);border:1px solid var(--orange-200);border-radius:14px;padding:14px 16px;margin:14px 0;box-shadow:var(--sh-sm);}
  .amount-line{display:flex;align-items:center;justify-content:space-between;padding:5px 0;}
  .amount-line .lbl{color:var(--text-2);font-size:14px;}
  .amount-line .val{font-weight:800;font-size:16px;}
  .amount-line.total .val{color:var(--orange-700);font-size:20px;}
  .amount-line .val.rem{color:var(--danger);}
  .deposit-input{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .deposit-input input{width:120px;text-align:right;font-weight:800;}

  /* ============ 日期选择器弹窗 ============ */
  .modal-mask{position:fixed;inset:0;background:rgba(20,12,4,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:560px){.modal-mask{align-items:center;}}
  .modal{
    background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;
    box-shadow:var(--sh-lg);animation:slideUp .25s ease both;
  }
  @media(min-width:560px){.modal{border-radius:18px;}}
  @keyframes slideUp{from{transform:translateY(30px);opacity:.6;}to{transform:none;opacity:1;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;border-radius:18px 18px 0 0;}
  .modal-head h3{font-size:17px;font-weight:800;}
  .modal-close{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--muted);}
  .modal-body{padding:14px 16px 22px;}

  /* ============ 配比计算视图 ============ */
  .plan-header{background:linear-gradient(180deg,#fff,#FFF9F4);border:1px solid var(--line);border-left:5px solid var(--orange-500);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh);}
  .plan-title{font-size:20px;font-weight:800;letter-spacing:.5px;}
  .plan-date{margin-top:2px;color:var(--muted);font-size:14px;}
  .plan-summary{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong);font-size:13px;color:var(--text-2);}
  .plan-summary b{color:var(--orange-700);font-size:15px;}
  .ps-hint{color:var(--muted);}

  .cat-section{margin-bottom:12px;}
  .cat-header{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--sh-sm);user-select:none;transition:background .15s,border-color .15s;}
  .cat-header:active{background:var(--surface-2);}
  .cat-arrow{color:var(--orange-500);font-size:12px;width:16px;text-align:center;transition:transform .25s ease;}
  .cat-section.collapsed .cat-arrow{transform:rotate(-90deg);}
  .cat-name{font-weight:800;font-size:16px;flex:1;}
  .cat-count{background:var(--orange-50);color:var(--orange-700);font-weight:700;font-size:12px;padding:2px 10px;border-radius:20px;}
  .cat-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s ease;}
  .cat-section.collapsed .cat-body{grid-template-rows:0fr;}
  .cat-inner{overflow:hidden;display:flex;flex-direction:column;gap:8px;padding-top:8px;}

  .prod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh-sm);display:flex;align-items:center;justify-content:space-between;gap:12px;transition:box-shadow .15s,transform .15s,border-color .15s;}
  .prod-card:focus-within{border-color:var(--orange-200);box-shadow:var(--sh);}
  .prod-name{font-weight:700;font-size:16px;flex:0 0 auto;}
  .prod-input-row{display:flex;align-items:center;gap:10px;}
  .prod-label{color:var(--muted);font-size:13px;white-space:nowrap;}
  .qty-box{display:flex;align-items:center;background:var(--surface-2);border:2px solid var(--line-strong);border-radius:12px;padding:4px 6px 4px 14px;transition:border-color .15s,background .15s;}
  .qty-box:focus-within{border-color:var(--orange-400);background:#fff;}
  .qty-input{border:none;background:transparent;font-size:24px;font-weight:800;width:100px;text-align:right;color:var(--text);outline:none;}
  .qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .qty-input[type=number]{-moz-appearance:textfield;}
  .unit-suffix{color:var(--orange-600);font-weight:800;font-size:15px;margin:0 6px 0 2px;}
  .clear-btn{border:none;background:var(--danger-soft);color:var(--danger);width:32px;height:32px;border-radius:9px;font-size:20px;line-height:1;cursor:pointer;flex:0 0 auto;transition:background .15s,transform .1s;}
  .clear-btn:hover{background:#F8C9C9;}
  .clear-btn:active{transform:scale(.9);}

  .action-bar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px;}

  .result-block{margin-top:18px;animation:fadeUp .3s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .result-title{font-size:18px;font-weight:800;color:var(--orange-700);margin:0 0 10px;border-left:5px solid var(--orange-500);padding-left:10px;}
  .detail-card,.summary-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh);}
  .detail-card{border-left:5px solid var(--orange-400);}
  .detail-head{font-size:17px;font-weight:800;color:var(--orange-700);}
  .detail-meta{color:var(--muted);font-size:13px;margin:4px 0 10px;}
  .detail-empty,.empty-tip{color:var(--muted);font-size:14px;padding:8px 0;}
  .detail-materials,.summary-card{display:flex;flex-direction:column;gap:2px;}
  .mat-line,.sum-line{display:flex;align-items:baseline;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line);}
  .mat-line:last-child,.sum-line:last-child{border-bottom:none;}
  .mat-name{flex:1;font-weight:600;}
  .mat-amt{font-weight:800;font-size:16px;color:var(--text);white-space:nowrap;}
  .mat-theory{color:var(--muted);font-size:12px;white-space:nowrap;}

  .summary-card{border-left:5px solid var(--orange-500);background:linear-gradient(180deg,#FFFDF8,#FFF6E9);}
  .summary-card .sum-line .mat-amt{color:var(--orange-700);font-size:17px;}
  .sum-total{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:10px;border-top:2px solid var(--orange-200);font-weight:800;color:var(--orange-800);}

  /* ============ 底部导航 ============ */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);display:flex;border-top:1px solid var(--line);z-index:30;box-shadow:0 -2px 10px rgba(40,30,20,.07);}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;border:none;background:none;position:relative;transition:color .15s;font-family:inherit;}
  .nav-item .nav-ico{font-size:21px;line-height:1;transition:transform .15s;}
  .nav-item.active{color:var(--orange-600);}

function lYearDays(y){var sum=348,i;for(i=0x8000;i>0x8;i>>=1){sum+=(lunarInfo[y-1900]&i)?1:0;}return sum+leapDays(y);}
function leapDays(y){if(leapMonth(y)){return (lunarInfo[y-1900]&0x10000)?30:29;}return 0;}
function leapMonth(y){return lunarInfo[y-1900]&0xf;}
function monthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function solar2lunar(y,m,d){
  var offset=(Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000;
  var temp=0,i;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  var ly=i;
  var leapM=leapMonth(ly);
  var isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leapM>0&&i===(leapM+1)&&!isLeap){--i;isLeap=true;temp=leapDays(ly);}
    else{temp=monthDays(ly,i);}
    if(isLeap===true&&i===(leapM+1))isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leapM>0&&i===leapM+1){if(isLeap){isLeap=false;}else{isLeap=true;--i;}}
  if(offset<0){offset+=temp;--i;}
  return {lYear:ly,lMonth:i,lDay:offset+1,isLeap:isLeap,cGan:(ly-1864)%10,cZhi:(ly-1864)%12};
}
function toChinaDay(d){
  if(d===10)return '初十';if(d===20)return '二十';if(d===30)return '三十';

  if(d<10)return '初'+nStr1[o];
  return nStr2[t]+nStr1[o];
}
function toChinaMonth(m){return (m<1||m>12)?'':nStr3[m-1]+'月';}
function lunarText(y,m,d){
  var L=solar2lunar(y,m,d);
  var md=(L.isLeap?'闰':'')+toChinaMonth(L.lMonth);
  var dd=toChinaDay(L.lDay);
  var ganzhi=Gan[L.cGan]+Zhi[L.cZhi]+'年';
  var fest=lunarFestival[L.lMonth+'-'+L.lDay];
  return {monthDay:dd,ganzhi:ganzhi,full:L.isLeap?'闰'+toChinaMonth(L.lMonth)+dd:md+dd,fest:fest};
}

function migrateOld(raw){
  // 旧结构：{categories,products(standardYield),todayPlan}
  var d=JSON.parse(JSON.stringify(DEFAULT_DATA));
  if(raw.categories) d.categories=raw.categories.map(function(c,i){return {id:c.id||genId('c'),name:c.name,sort:i+1};});
  if(raw.products){
    d.products=raw.products.map(function(p){

      };
    });
  }
  if(raw.todayPlan) d.todayPlan=raw.todayPlan;
  return d;
}
function loadData(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d&&d.categories&&d.products){
        if(!d.orders)d.orders=[];if(!d.productionPlans)d.productionPlans={};if(!d.settings)d.settings={};
        if(!d.todayPlan)d.todayPlan={};
        if(!d.dataVersion)d.dataVersion=1;
        return d;
      }
    }
    // 兼容旧版 key
    var old=localStorage.getItem(OLD_KEY);
    if(old){
      var od=JSON.parse(old);
      if(od&&od.categories&&od.products){
        var nd=migrateOld(od);
        localStorage.setItem(LS_KEY,JSON.stringify(nd));
        localStorage.removeItem(OLD_KEY);
        return nd;
      }
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){alert('保存失败：'+e.message);}}

    '<button class="order-tab'+(orderTab==='today'?' active':'')+'" data-tab="today">今日订单</button>'+
    '<button class="order-tab'+(orderTab==='all'?' active':'')+'" data-tab="all">所有订单</button>'+
    '</div></div>';
  html+='<div class="view" style="padding-top:12px;">';
  if(orderTab==='today') html+=renderTodayOrdersInner();
  else html+=renderAllOrdersInner();
  html+='</div>';
  root.innerHTML=html;

  root.querySelectorAll('.order-tab').forEach(function(b){
    b.addEventListener('click',function(){orderTab=b.dataset.tab;renderOrders();});
  });
  if(orderTab==='today') bindTodayOrders(root);
  else bindAllOrders(root);
}

function renderTodayOrdersInner(){
  var t=todayStr();
  return renderDayOrdersInner(t,true);
}
function renderAllOrdersInner(){
  if(!calYear){var d=new Date();calYear=d.getFullYear();calMonth=d.getMonth()+1;}
  var html='<div class="cal-top">'+
    '<button class="cal-nav-btn" data-cal="prev" style="border:none;background:var(--orange-50);color:var(--orange-700);font-weight:800;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px;">‹</button>'+
    '<div class="cal-title">'+calYear+'年'+calMonth+'月</div>'+
    '<div class="cal-nav"><button data-cal="today" style="border:none;background:var(--orange-50);color:var(--orange-700);font-weight:800;padding:0 12px;height:38px;border-radius:10px;cursor:pointer;font-size:13px;">今天</button>'+
    '<button data-cal="next" style="border:none;background:var(--orange-50);color:var(--orange-700);font-weight:800;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px;">›</button></div>'+
    '</div>';
  html+='<div class="cal-grid"><div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>';
  html+='<div class="cal-days">'+buildCalendarCells(calYear,calMonth)+'</div></div>';
  // 若已选中某天，列出当天订单
  if(dayOrdersDate){
    html+='<div class="section-bar"><button class="link-btn" data-backcal="1">← 返回月历</button><h2>'+dayOrdersDate+' 订单</h2></div>';
    html+=renderDayOrdersInner(dayOrdersDate,false);
  }
  return html;
}
function buildCalendarCells(y,m){
  var first=new Date(y,m-1,1);
  var startOffset=(first.getDay()+6)%7; // 周一为首列
  var daysInMonth=new Date(y,m,0).getDate();
  var cells='';
  var i;
  // 上月补位
  var prevDays=new Date(y,m-1,0).getDate();
  for(i=startOffset-1;i>=0;i--){cells+='<div class="cal-cell out"><div class="d">'+(prevDays-i)+'</div></div>';}
  var t=todayStr();
  for(i=1;i<=daysInMonth;i++){
    var ds=y+'-'+pad2(m)+'-'+pad2(i);
    var L=lunarText(y,m,i);
    var isToday=(ds===t);
    var cnt=validOrdersOfDate(ds).length;
    var cls='cal-cell'+(isToday?' today':'')+(cnt>0?' has':'');
    cells+='<div class="'+cls+'" data-date="'+ds+'"><div class="d">'+i+'</div>'+
      '<div class="l">'+(L.fest?L.fest:L.monthDay)+'</div>'+
      (cnt>0?'<div class="n">'+cnt+'单</div>':'')+'</div>';
  }
  // 下月补位
  var total=startOffset+daysInMonth;
  var rem=(7-(total%7))%7;
  for(i=1;i<=rem;i++){cells+='<div class="cal-cell out"><div class="d">'+i+'</div></div>';}
  return cells;
}
function bindAllOrders(root){
  root.querySelectorAll('[data-cal]').forEach(function(b){
    b.addEventListener('click',function(){
      var a=b.dataset.cal;
      if(a==='prev'){calMonth--;if(calMonth<1){calMonth=12;calYear--;}}
      else if(a==='next'){calMonth++;if(calMonth>12){calMonth=1;calYear++;}}
      else if(a==='today'){var d=new Date();calYear=d.getFullYear();calMonth=d.getMonth()+1;dayOrdersDate=todayStr();}
      renderOrders();
    });
  });
  root.querySelectorAll('.cal-cell[data-date]').forEach(function(c){
    c.addEventListener('click',function(){
      var ds=c.dataset.date;dayOrdersDate=ds;renderOrders();window.scrollTo(0,0);
    });
  });
  var back=root.querySelector('[data-backcal]');
  if(back) back.addEventListener('click',function(){dayOrdersDate=null;renderOrders();});
  var bnd=root.querySelector('#btnNewOrderD');if(bnd)bnd.addEventListener('click',function(){openNewOrder(dayOrdersDate);});
  var bpd=root.querySelector('#btnProductionD');if(bpd)bpd.addEventListener('click',function(){openProduction(dayOrdersDate);});
}

function renderDayOrdersInner(dateStr,isTodayHeader){
  var orders=ordersOfDate(dateStr);
  var p=parseDate(dateStr);var L=lunarText(p.y,p.m,p.d);
  var valid=validOrdersOfDate(dateStr);
  var totalCount=0,unpicked=0,picked=0;
  valid.forEach(function(o){o.items.forEach(function(it){totalCount+=it.quantity;});if(o.status==='picked')picked++;else unpicked++;});
  var html='';
  if(isTodayHeader){
    html+='<div class="stat-card">'+
      '<div class="stat-date">'+dateStr+'　'+weekdayCn(dateStr)+'</div>'+
      '<div class="stat-lunar">农历 '+L.full+'　'+L.ganzhi+'</div>'+
      '<div class="stat-grid">'+
        '<div class="stat-cell"><div class="v">'+(valid.length)+'</div><div class="k">今日订单</div></div>'+
        '<div class="stat-cell"><div class="v">'+fmtCount(totalCount)+'</div><div class="k">产品总数</div></div>'+
        '<div class="stat-cell"><div class="v gray">'+unpicked+'</div><div class="k">未取</div></div>'+
        '<div class="stat-cell"><div class="v green">'+picked+'</div><div class="k">已取货</div></div>'+
      '</div></div>';
    html+='<div class="action-bar"><button class="btn btn-primary" id="btnNewOrder">＋ 新增订单</button>'+
      '<button class="btn btn-secondary" id="btnProduction">📊 今日生产汇总</button></div>';
  }else{
    html+='<div class="action-bar"><button class="btn btn-secondary" id="btnNewOrderD">＋ 新增订单</button>'+
      '<button class="btn btn-info" id="btnProductionD">📊 当天生产汇总</button></div>';
  }
  if(orders.length===0){
    html+='<div class="empty-tip">该日暂无订单。<br>点击上方「新增订单」创建。'+(!isTodayHeader?'':'' )+'</div>';
  }else{
    orders.forEach(function(o){html+=orderCardHTML(o);});
  }
  return html;
}
function bindTodayOrders(root){
  var bn=root.querySelector('#btnNewOrder');if(bn)bn.addEventListener('click',function(){openNewOrder(todayStr());});
  var bp=root.querySelector('#btnProduction');if(bp)bp.addEventListener('click',function(){openProduction(todayStr());});
}

    (o.status==='picked'?'<span class="badge picked">已取货</span>':'<span class="badge unpicked">未取</span>');

    return '<div class="oc-item"><span class="nm">'+escapeHtml(it.productName)+'</span><span class="qty">'+fmtCount(it.quantity)+' 个</span></div>';
  }).join('');

      '<div class="row"><span class="lbl">订单金额</span><span class="val amt">'+fmtMoney(o.orderAmount)+'</span></div>'+
      '<div class="row"><span class="lbl">定金</span><span class="val">'+fmtMoney(o.deposit)+'</span></div>'+
      '<div class="row"><span class="lbl">还需支付</span><span class="val rem">'+fmtMoney(o.remainingAmount)+'</span></div>'+
      '<div class="row"><span class="lbl">产品总数</span><span class="val">'+fmtCount(totalQty)+' 个</span></div>'+
    '</div>';

  return '<div class="order-card'+(o.status==='picked'?' picked':'')+(o.cancelled?' cancelled':'')+'">'+
    '<div class="oc-head"><span class="oc-no">'+escapeHtml(o.orderNo)+'</span>'+statusBadge+'</div>'+
    '<div class="oc-items">'+(itemsHtml||'<div class="detail-empty">（无产品）</div>')+'</div>'+

      '<button class="btn btn-ghost btn-sm" data-act="toggle" data-id="'+o.id+'">'+(o.status==='picked'?'改为未取':'设为已取货')+'</button>'+
      '<button class="btn btn-ghost btn-sm" data-act="cancel" data-id="'+o.id+'">取消</button>'+

/* ---- 订单列表内的卡片操作（事件委托，绑定在 view-orders 上） ---- */
document.getElementById('view-orders').addEventListener('click',function(e){
  var btn=e.target.closest('[data-act]');
  if(!btn)return;
  var id=btn.dataset.id,act=btn.dataset.act,o=state.orders.find(function(x){return x.id===id;});
  if(!o)return;
  if(act==='detail') openOrderDetail(id);
  else if(act==='edit') openEditOrder(id);
  else if(act==='copy') openCopyOrder(id);
  else if(act==='toggle') toggleStatus(o);
  else if(act==='cancel') cancelOrder(o);
  else if(act==='del') deleteOrder(o);
});
function toggleStatus(o){
  if(o.status==='picked'){
    if(confirm('该订单当前状态为「已取货」。\n确认要修改为「未取」吗？')){o.status='unpicked';o.updatedAt=nowISO();saveData();renderOrders();}
  }else{
    o.status='picked';o.updatedAt=nowISO();saveData();renderOrders();
  }
}
function cancelOrder(o){
  if(confirm('确定取消该订单吗？\n取消后不计入生产汇总与金额统计，但保留历史记录。')){
    o.cancelled=true;o.updatedAt=nowISO();markPlanDirty(o.orderDate);saveData();renderOrders();
  }
}
function deleteOrder(o){
  if(confirm('确定删除该订单吗？此操作不可撤销，仅用于删除明显录错的数据。')){
    state.orders=state.orders.filter(function(x){return x.id!==o.id;});
    markPlanDirty(o.orderDate);saveData();renderOrders();
  }
}
function nowISO(){return new Date().toISOString().slice(0,19);}
function markPlanDirty(dateStr){
  var pp=state.productionPlans[dateStr];
  if(pp) pp.dirty=true;
}

var editBuf=null; // {mode, id, orderDate, items:{pid:qty}, deposit, note}

function openNewOrder(dateStr){
  editBuf={mode:'new',id:null,orderDate:dateStr||todayStr(),items:{},deposit:0,note:''};
  renderOrderEdit();
}
function openEditOrder(id){
  var o=state.orders.find(function(x){return x.id===id;});if(!o)return;
  var items={};o.items.forEach(function(it){items[it.productId]=it.quantity;});
  editBuf={mode:'edit',id:id,orderDate:o.orderDate,items:items,deposit:o.deposit,note:o.note||''};
  renderOrderEdit();
}
function openCopyOrder(id){
  var o=state.orders.find(function(x){return x.id===id;});if(!o)return;
  var items={};o.items.forEach(function(it){items[it.productId]=it.quantity;});
  // 复制订单：重新读取当前产品价格（新订单用当前价），日期=今天，定金=0，状态=未取
  editBuf={mode:'copy',id:null,orderDate:todayStr(),items:items,deposit:0,note:o.note||''};
  renderOrderEdit();
}
function renderOrderEdit(){
  var b=editBuf;
  var p=parseDate(b.orderDate);var L=lunarText(p.y,p.m,p.d);
  var prods=enabledProducts();
  var groups=state.categories.map(function(cat){
    var ps=prods.filter(function(pr){return pr.categoryId===cat.id;});
    if(ps.length===0)return '';
    var rows=ps.map(function(pr){
      var q=b.items[pr.id]||0;
      var price=pr.price||0;
      var sub=q*(price/100);
      return '<div class="pe-card">'+
        '<div class="pe-head"><span class="pe-name">'+escapeHtml(pr.name)+'</span>'+
        '<span class="pe-price">'+(price>0?('¥'+(price/100).toFixed(2)+' /个'):'未设价')+'</span></div>'+
        '<div class="pe-row">'+
          '<div class="stepper">'+
            '<button data-step="-1" data-pid="'+pr.id+'">−</button>'+
            '<input type="number" inputmode="numeric" min="0" step="1" data-qty="'+pr.id+'" value="'+q+'">'+
            '<button data-step="1" data-pid="'+pr.id+'">＋</button>'+
          '</div>'+
          '<span class="pe-sub"><b data-sub="'+pr.id+'">'+fmtMoney(sub*100)+'</b></span>'+
        '</div></div>';
    }).join('');
    return '<div class="pe-group"><div class="pe-group-title">'+escapeHtml(cat.name)+'</div>'+rows+'</div>';
  }).join('');

  var totalQty=0,totalCents=0;
  Object.keys(b.items).forEach(function(pid){var q=b.items[pid];if(q>0){var pr=findProd(pid);if(pr){totalQty+=q;totalCents+=q*(pr.price||0);}}});
  var depositCents=yuanToCents(b.deposit/100);
  var depYuan=(b.deposit/100).toFixed(2);
  var remainingCents=totalCents-depositCents;

  var root=document.getElementById('view-order-edit');
  root.classList.remove('hidden');
  root.innerHTML='<div class="ov-top"><button class="ov-back" id="oeBack">← 返回</button><h2>'+(b.mode==='edit'?'编辑订单':(b.mode==='copy'?'复制订单':'新增订单'))+'</h2></div>'+
    '<div class="ov-body">'+
      '<div class="field"><label>订单日期 <span class="req">*</span></label>'+
        '<div class="date-pick" id="oeDate">'+
          '<div><div class="dp-main">'+b.orderDate+'　'+weekdayCn(b.orderDate)+'</div><div class="dp-lunar">农历 '+L.full+'　'+L.ganzhi+'</div></div>'+
          '<span class="dp-edit">更改日期 ›</span>'+
        '</div></div>'+
      '<div class="field"><label>产品数量（按「个」）</label><div class="prod-edit-list">'+groups+'</div></div>'+
      '<div class="amount-box">'+
        '<div class="amount-line"><span class="lbl">产品总数</span><span class="val" id="oeTotalQty">'+fmtCount(totalQty)+' 个</span></div>'+
        '<div class="amount-line total"><span class="lbl">订单金额</span><span class="val" id="oeTotalAmt">'+fmtMoney(totalCents)+'</span></div>'+
        '<div class="amount-line"><span class="lbl">定金金额</span>'+
          '<span class="deposit-input"><input type="number" inputmode="decimal" min="0" step="0.01" id="oeDeposit" value="'+depYuan+'"> 元</span></div>'+
        '<div class="amount-line"><span class="lbl">还需支付</span><span class="val rem" id="oeRemain">'+fmtMoney(remainingCents)+'</span></div>'+
      '</div>'+
      '<div class="field"><label>备注（客户姓名 / 电话 / 取货时间 / 特殊要求等，可留空）</label>'+
        '<textarea id="oeNote" placeholder="例：王先生 138****8888\n早上6:30取货，优先生产。">'+escapeHtml(b.note)+'</textarea></div>'+
      '<div class="action-bar">'+
        '<button class="btn btn-primary" id="oeSave">保存订单</button>'+
        '<button class="btn btn-ghost" id="oeCancel">取消</button>'+
      '</div>'+
    '</div>';

  document.getElementById('oeBack').addEventListener('click',closeOverlays);
  document.getElementById('oeCancel').addEventListener('click',closeOverlays);
  document.getElementById('oeDate').addEventListener('click',function(){
    openDatePicker(b.orderDate,function(ds){b.orderDate=ds;renderOrderEdit();});
  });
  // 步进
  root.querySelectorAll('.stepper button[data-step]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var pid=btn.dataset.pid,step=parseInt(btn.dataset.step,10);
      var inp=root.querySelector('input[data-qty="'+pid+'"]');
      var v=parseInt(inp.value,10)||0;v=Math.max(0,v+step);inp.value=v;b.items[pid]=v;updateEditTotals();
    });
  });
  root.querySelectorAll('input[data-qty]').forEach(function(inp){
    inp.addEventListener('input',function(){
      var pid=inp.dataset.qty,v=parseInt(inp.value,10)||0;if(v<0)v=0;
      b.items[pid]=v;updateEditTotals();
    });
  });
  document.getElementById('oeDeposit').addEventListener('input',updateEditTotals);
  document.getElementById('oeNote').addEventListener('input',function(){b.note=this.value;});
  document.getElementById('oeSave').addEventListener('click',saveOrder);
  function updateEditTotals(){
    var tq=0,tc=0;
    Object.keys(b.items).forEach(function(pid){var q=b.items[pid];if(q>0){var pr=findProd(pid);if(pr){tq+=q;tc+=q*(pr.price||0);}}});
    var dep=yuanToCents(document.getElementById('oeDeposit').value);
    document.getElementById('oeTotalQty').textContent=fmtCount(tq)+' 个';
    document.getElementById('oeTotalAmt').textContent=fmtMoney(tc);
    document.getElementById('oeRemain').textContent=fmtMoney(tc-dep);
    // 更新小计
    Object.keys(b.items).forEach(function(pid){var q=b.items[pid];var pr=findProd(pid);var subEl=root.querySelector('[data-sub="'+pid+'"]');if(subEl&&pr)subEl.textContent=fmtMoney(q*(pr.price||0));});
  }
}
function saveOrder(){
  var b=editBuf;
  // 校验
  if(!b.orderDate){alert('请选择订单日期');return;}
  var items=[];var has=false;
  Object.keys(b.items).forEach(function(pid){
    var q=parseInt(b.items[pid],10)||0;
    if(q>0){var pr=findProd(pid);if(pr){items.push({productId:pid,productName:pr.name,quantity:q,unitPrice:pr.price||0,subtotal:q*(pr.price||0)});has=true;}}
  });
  if(!has){alert('请至少录入 1 个产品数量（数量需 ≥ 1）。');return;}
  var totalCents=items.reduce(function(s,it){return s+it.subtotal;},0);
  var depositCents=yuanToCents(document.getElementById('oeDeposit').value);
  if(depositCents<0){alert('定金不能为负数');return;}
  if(depositCents>totalCents){alert('定金不能大于订单金额（¥'+(totalCents/100).toFixed(2)+'）。');return;}

  if(b.mode==='edit'){
    var o=state.orders.find(function(x){return x.id===b.id;});
    o.orderDate=b.orderDate;o.items=items;o.orderAmount=totalCents;o.deposit=depositCents;
    o.remainingAmount=totalCents-depositCents;o.note=b.note;o.updatedAt=nowISO();
    markPlanDirty(b.orderDate);saveData();renderOrders();closeOverlays();
  }else{
    // 生成订单号 YYYYMMDD-001
    var orderNo=nextOrderNo(b.orderDate);
    var o2={id:genId('ord'),orderNo:orderNo,orderDate:b.orderDate,status:'unpicked',cancelled:false,
      deposit:depositCents,orderAmount:totalCents,remainingAmount:totalCents-depositCents,note:b.note,
      createdAt:nowISO(),updatedAt:nowISO(),items:items};
    state.orders.push(o2);markPlanDirty(b.orderDate);saveData();
    // 保存后返回该日期对应页面
    orderTab=(b.orderDate===todayStr())?'today':'all';
    dayOrdersDate=(b.orderDate===todayStr())?null:b.orderDate;
    renderOrders();closeOverlays();
  }
}
function nextOrderNo(dateStr){
  var prefix=dateStr.replace(/-/g,'');
  var max=0;
  state.orders.forEach(function(o){
    if(o.orderDate===dateStr){
      var m=/(\d+)$/.exec(o.orderNo);if(m){var n=parseInt(m[1],10);if(n>max)max=n;}
    }
  });
  return prefix+'-'+String(max+1).padStart(3,'0');
}

 *  生产汇总 + 发送到配比计算

function orderSignature(dateStr){
  var orders=validOrdersOfDate(dateStr);
  return orders.map(function(o){return o.id+':'+o.items.map(function(i){return i.productId+'='+i.quantity;}).join(',');}).sort().join('|');
}
function openProduction(dateStr){
  // 计算当日订单数量
  var prodQty={};
  validOrdersOfDate(dateStr).forEach(function(o){
    o.items.forEach(function(it){prodQty[it.productId]=(prodQty[it.productId]||0)+it.quantity;});
  });
  var pids=Object.keys(prodQty);
  // 载入已保存计划（保留手动调整）
  var saved=state.productionPlans[dateStr];
  var items=pids.map(function(pid){
    var pr=findProd(pid);
    var prodQ=prodQty[pid];
    var actual=prodQ;
    if(saved){
      var s=saved.items.find(function(x){return x.productId===pid;});
      if(s&&typeof s.productionQuantity==='number')actual=s.productionQuantity;
    }
    return {productId:pid,productName:pr?pr.name:'(已删除)',orderQuantity:prodQ,productionQuantity:actual};
  });
  var sig=orderSignature(dateStr);
  var dirty=saved? (saved.orderVersion!==sig):false;
  if(pids.length===0){
    var root=document.getElementById('view-production');root.classList.remove('hidden');
    root.innerHTML='<div class="ov-top"><button class="ov-back" id="prBack">← 返回</button><h2>生产汇总</h2></div>'+
      '<div class="ov-body"><div class="empty-tip">'+dateStr+' 没有有效订单，无法生成生产汇总。</div></div>';
    document.getElementById('prBack').addEventListener('click',closeOverlays);
    return;
  }
  renderProductionBody(dateStr,items,sig,dirty);
}
function renderProductionBody(dateStr,items,sig,dirty){
  var totalOrder=0,totalProd=0;
  items.forEach(function(it){totalOrder+=it.orderQuantity;totalProd+=it.productionQuantity;});
  var rows=items.map(function(it){
    return '<div class="prod-row"><span class="pr-name">'+escapeHtml(it.productName)+'</span>'+
      '<span class="pr-qty">订单 '+fmtCount(it.orderQuantity)+' 个</span>'+
      '<input type="number" inputmode="numeric" min="0" step="1" class="pr-input" data-pid="'+it.productId+'" value="'+it.productionQuantity+'"> 个</div>';
  }).join('');
  var root=document.getElementById('view-production');
  root.classList.remove('hidden');
  root.innerHTML='<div class="ov-top"><button class="ov-back" id="prBack">← 返回</button><h2>生产汇总</h2></div>'+
    '<div class="ov-body">'+
      '<div class="stat-card"><div class="stat-date">'+dateStr+'　'+weekdayCn(dateStr)+'</div>'+
        '<div class="stat-lunar">按日期汇总各产品「订单数量 / 实际生产数量」</div></div>'+
      (dirty?'<div class="banner">⚠ 该日订单已发生变化，当前显示为您上次保存的调整值。请确认后重新「生成 / 刷新」。</div>':'')+
      '<div class="field"><label>实际生产数量（默认等于订单数量，可手动调整）</label>'+rows+'</div>'+
      '<div class="amount-box"><div class="amount-line"><span class="lbl">订单总数量</span><span class="val" id="prOrder">'+fmtCount(totalOrder)+' 个</span></div>'+
        '<div class="amount-line total"><span class="lbl">实际生产总数量</span><span class="val" id="prProd">'+fmtCount(totalProd)+' 个</span></div></div>'+
      '<div class="action-bar">'+
        '<button class="btn btn-secondary" id="prReset">生成 / 刷新（取订单数量）</button>'+
        '<button class="btn btn-primary" id="prSend">📤 发送到配比计算</button>'+
      '</div>'+
    '</div>';
  document.getElementById('prBack').addEventListener('click',closeOverlays);
  root.querySelectorAll('.pr-input').forEach(function(inp){
    inp.addEventListener('input',function(){
      var pid=inp.dataset.pid,it=items.find(function(x){return x.productId===pid;});
      it.productionQuantity=Math.max(0,parseInt(inp.value,10)||0);updateProdTotals();
    });
  });
  function updateProdTotals(){
    var to=0,tp=0;items.forEach(function(it){to+=it.orderQuantity;tp+=it.productionQuantity;});
    document.getElementById('prOrder').textContent=fmtCount(to)+' 个';
    document.getElementById('prProd').textContent=fmtCount(tp)+' 个';
  }
  document.getElementById('prReset').addEventListener('click',function(){
    items.forEach(function(it){it.productionQuantity=it.orderQuantity;});
    renderProductionBody(dateStr,items,sig,false);
  });
  document.getElementById('prSend').addEventListener('click',function(){sendToCalc(dateStr,items,sig);});
}
function sendToCalc(dateStr,items,sig){
  // 保存计划
  state.productionPlans[dateStr]={date:dateStr,items:items.map(function(it){return {productId:it.productId,orderQuantity:it.orderQuantity,productionQuantity:it.productionQuantity};}),orderVersion:sig,updatedAt:nowISO(),dirty:false};
  // 写入今日生产计划（配比计算读取实际生产数量）
  state.todayPlan={};
  items.forEach(function(it){if(it.productionQuantity>0)state.todayPlan[it.productId]=it.productionQuantity;});
  saveData();
  closeOverlays();
  showView('calc');
  renderPlan();
  onCalculate();
  document.getElementById('resultArea').scrollIntoView({behavior:'smooth',block:'start'});
  alert('已发送到配比计算：'+dateStr+' 共 '+items.length+' 种产品。');
}

function buildProductInputCard(p){
  var card=document.createElement('div');card.className='prod-card';
  var val=state.todayPlan[p.id]||'';
  card.innerHTML='<div class="prod-name">'+escapeHtml(p.name)+'</div>'+
    '<div class="prod-input-row"><span class="prod-label">今日计划</span>'+

    '<span class="unit-suffix">个</span><button class="clear-btn" data-id="'+p.id+'" title="清空" aria-label="清空">×</button></div></div>';
  var input=card.querySelector('.qty-input');
  input.addEventListener('input',function(e){var v=e.target.value;if(v===''||parseFloat(v)<=0)delete state.todayPlan[p.id];else state.todayPlan[p.id]=v;saveData();updatePlanSummary();});
  card.querySelector('.clear-btn').addEventListener('click',function(){delete state.todayPlan[p.id];input.value='';saveData();updatePlanSummary();});
  return card;

function calculate(){
  var plan=state.todayPlan||{};var results=[];var summary={};var hasPlan=false;
  state.products.forEach(function(p){
    var qty=parseFloat(plan[p.id]);if(!qty||qty<=0)return;hasPlan=true;
    var yield_=parseFloat(p.recipeYield)||0;var ratio=yield_>0?qty/yield_:0;var materials=[];
    (p.recipe||[]).forEach(function(m){
      var nm=(m.name||'').trim();if(!nm)return;
      var stdKg=toKg(m.amount,m.unit);var theoryKg=stdKg*ratio;var loss=(parseFloat(p.lossRate)||0)/100;
      var actualKg=theoryKg*(1+loss);
      materials.push({name:nm,theoryKg:theoryKg,actualKg:actualKg,lossApplied:loss>0});
      if(!summary[nm])summary[nm]={theory:0,actual:0};
      summary[nm].theory+=theoryKg;summary[nm].actual+=actualKg;
    });
    results.push({product:p,qty:qty,ratio:ratio,materials:materials,lossRate:parseFloat(p.lossRate)||0,noYield:yield_<=0});
  });
  return {results:results,summary:summary,hasPlan:hasPlan};
}
function buildResultHTML(r){
  if(!r.hasPlan)return '<div class="empty-tip">📭 请在上方输入今日各产品的生产数量，或前往「订单 → 生产汇总 → 发送到配比计算」。</div>';
  var html='<div class="result-block"><h2 class="result-title">今日产品配料明细</h2>';
  r.results.forEach(function(item){
    html+='<div class="detail-card"><div class="detail-head">'+escapeHtml(item.product.name)+'</div>'+
      '<div class="detail-meta">计划生产：'+fmtCount(item.qty)+' 个　|　配方倍率：'+fmtKg(item.ratio)+'</div>';
    if(item.noYield)html+='<div class="detail-empty">（该产品的「标准产量」未设置，无法计算，请在配方管理中设置）</div>';
    else if(item.materials.length===0)html+='<div class="detail-empty">（暂未设置配方，请在「配方管理」中录入原料）</div>';
    else{
      html+='<div class="detail-materials">';
      item.materials.forEach(function(m){
        html+='<div class="mat-line"><span class="mat-name">'+escapeHtml(m.name)+'</span><span class="mat-amt">'+fmtKg(m.actualKg)+' kg</span>';
        if(m.lossApplied)html+='<span class="mat-theory">（理论 '+fmtKg(m.theoryKg)+' kg）</span>';
        html+='</div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  html+='</div>';
  var names=Object.keys(r.summary);
  if(names.length>0){
    var hasLoss=r.results.some(function(it){return it.lossRate>0;});
    html+='<div class="result-block"><h2 class="result-title">今日原料总需求</h2><div class="summary-card">';
    var totalTheory=0,totalActual=0;
    names.forEach(function(name){var s=r.summary[name];totalTheory+=s.theory;totalActual+=s.actual;
      html+='<div class="sum-line"><span class="mat-name">'+escapeHtml(name)+'</span><span class="mat-amt">'+fmtKg(s.actual)+' kg</span>';
      if(hasLoss)html+='<span class="mat-theory">（理论 '+fmtKg(s.theory)+' kg）</span>';
      html+='</div>';
    });
    html+='<div class="sum-total"><span>原料合计（'+names.length+' 种）</span><span>'+fmtKg(totalActual)+' kg</span></div></div></div>';
  }else html+='<div class="empty-tip">暂无可用配方数据，无法汇总原料。</div>';
  return html;
}

function handleImportFile(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=JSON.parse(reader.result);
      if(!d||!d.categories||!d.products)throw new Error('文件格式不正确');
      // 兼容字段
      d.dataVersion=d.dataVersion||1;
      d.orders=d.orders||[];d.productionPlans=d.productionPlans||{};d.settings=d.settings||{};
      d.todayPlan=d.todayPlan||{};
      d.products=d.products.map(function(p){
        if(p.standardYield!==undefined&&p.recipeYield===undefined)p.recipeYield=p.standardYield;
        if(p.price===undefined)p.price=0;if(p.enabled===undefined)p.enabled=true;
        if(!p.recipe)p.recipe=[];
        return p;
      });
      state=d;saveData();localStorage.setItem(LS_PLAN_DATE,todayStr());
      renderPlan();renderRecipe();updatePlanSummary();renderOrders();
      alert('数据导入成功！');
    }catch(err){alert('导入失败：'+err.message);}
    e.target.value='';
  };
  reader.readAsText(file);
}

      '<input class="m-amt" type="number" inputmode="decimal" min="0" step="0.1" data-prod="'+p.id+'" data-mat="'+i+'" data-f="amount" value="'+escapeHtml(m.amount)+'">'+
      '<select class="m-unit" data-prod="'+p.id+'" data-mat="'+i+'" data-f="unit">'+
        '<option value="kg"'+(m.unit==='kg'?' selected':'')+'>kg</option><option value="g"'+(m.unit==='g'?' selected':'')+'>g</option></select>'+
      '<button class="btn btn-danger sm" data-act="delMat" data-prod="'+p.id+'" data-mat="'+i+'">删</button></div>';
  });
  return '<div class="prod-edit-card"><div class="field-row"><label>产品名称</label><input class="p-name" data-prod="'+p.id+'" data-f="name" value="'+escapeHtml(p.name)+'"></div>'+
    '<div class="field-row"><label>所属分类</label><select class="p-cat" data-prod="'+p.id+'" data-f="cat">'+catOptions+'</select>'+
      '<label>标准产量</label><div class="mini-qty"><input type="number" min="0" step="1" data-prod="'+p.id+'" data-f="yield" value="'+escapeHtml(p.recipeYield)+'"><span>个</span></div>'+
      '<label>损耗率</label><select class="p-loss" data-prod="'+p.id+'" data-f="loss">'+lossOptions+'</select></div>'+
    '<div class="field-row"><label>默认单价</label><div class="mini-qty"><input type="number" min="0" step="0.01" data-prod="'+p.id+'" data-f="price" value="'+priceVal+'"><span>元/个</span></div>'+
      '<label>启用</label><select class="p-cat" data-prod="'+p.id+'" data-f="enabled"><option value="1"'+(p.enabled!==false?' selected':'')+'>是</option><option value="0"'+(p.enabled===false?' selected':'')+'>否</option></select></div>'+
    '<div class="recipe-head"><span>配方原料</span><button class="btn btn-secondary sm" data-act="addMat" data-prod="'+p.id+'">+ 新增原料</button></div>'+
    '<div class="mat-list">'+(matHtml||'<div class="cat-sub">（暂无原料，点击上方新增）</div>')+'</div>'+
    '<div style="margin-top:10px;"><button class="btn btn-danger sm" data-act="delProd" data-prod="'+p.id+'">删除该产品</button></div></div>';
}
function attachRecipeListeners(){
  var root=document.getElementById('recipeContent');
  function onField(e){
    var el=e.target;var prodId=el.dataset.prod,matIdx=el.dataset.mat,f=el.dataset.f;if(!prodId||!f)return;
    var p=findProd(prodId);if(!p)return;
    if(matIdx!==undefined){var m=p.recipe[parseInt(matIdx,10)];if(!m)return;
      if(f==='name')m.name=el.value;else if(f==='amount')m.amount=parseFloat(el.value)||0;else if(f==='unit')m.unit=el.value;
      saveData();return;}
    if(f==='name')p.name=el.value;
    else if(f==='yield')p.recipeYield=parseFloat(el.value)||0;
    else if(f==='loss')p.lossRate=parseFloat(el.value)||0;
    else if(f==='price')p.price=yuanToCents(el.value);
    else if(f==='enabled')p.enabled=(el.value==='1');
    else if(f==='cat'){p.categoryId=el.value;saveData();if(e.type==='change')renderRecipe();return;}
    saveData();
  }
  root.addEventListener('input',onField);root.addEventListener('change',onField);
  root.addEventListener('input',function(e){var inp=e.target;if(inp.classList.contains('cat-name-input')){var cat=state.categories.find(function(c){return c.id===inp.dataset.cat;});if(cat){cat.name=inp.value;saveData();}}});
  root.addEventListener('click',function(e){
    var btn=e.target.closest('[data-act]');if(!btn)return;var act=btn.dataset.act;
    if(act==='addCat'){var name=prompt('请输入新分类名称：','新分类');if(name&&name.trim()){state.categories.push({id:genId('c'),name:name.trim(),sort:state.categories.length+1});saveData();renderRecipe();}}
    else if(act==='delCat'){var catId=btn.dataset.cat;var cnt=state.products.filter(function(p){return p.categoryId===catId;}).length;var msg='确定删除该分类吗？';if(cnt>0)msg='该分类下有 '+cnt+' 个产品，删除后这些产品也会一并删除。确定？';if(confirm(msg)){state.products=state.products.filter(function(p){return p.categoryId!==catId;});state.categories=state.categories.filter(function(c){return c.id!==catId;});saveData();renderRecipe();}}
    else if(act==='addProd'){var cid=btn.dataset.cat;state.products.push({id:genId('p'),name:'新商品',categoryId:cid,price:0,recipeYield:500,lossRate:0,enabled:true,recipe:[]});saveData();renderRecipe();}
    else if(act==='delProd'){var pid=btn.dataset.prod;if(confirm('确定删除该产品吗？删除后其配方将丢失。')){state.products=state.products.filter(function(p){return p.id!==pid;});delete state.todayPlan[pid];saveData();renderRecipe();}}
    else if(act==='addMat'){var pp=findProd(btn.dataset.prod);pp.recipe.push({name:'',amount:0,unit:'kg'});saveData();renderRecipe();}
    else if(act==='delMat'){var pr=findProd(btn.dataset.prod);pr.recipe.splice(parseInt(btn.dataset.mat,10),1);saveData();renderRecipe();}
  });
}

/* =================================================================
 *  覆盖层关闭
 * ================================================================= */
function closeOverlays(){
  document.getElementById('view-order-edit').classList.add('hidden');
  document.getElementById('view-order-detail').classList.add('hidden');
  document.getElementById('view-price').classList.add('hidden');
  document.getElementById('view-production').classList.add('hidden');
  closeDatePicker();
}

/* =================================================================
 *  初始化
 * ================================================================= */
function init(){
  var pd=localStorage.getItem(LS_PLAN_DATE);var today=todayStr();
  if(pd!==today){state.todayPlan={};saveData();localStorage.setItem(LS_PLAN_DATE,today);}
  if(!state.todayPlan)state.todayPlan={};

  renderDateCalc();renderPlan();attachRecipeListeners();
  renderOrders();
  showView('orders'); // 默认进入 订单 → 今日订单

  document.getElementById('btnCalc').addEventListener('click',onCalculate);
  document.getElementById('btnClear').addEventListener('click',onClear);
  document.getElementById('btnPrint').addEventListener('click',onPrint);
  document.getElementById('btnRecipe').addEventListener('click',openRecipe);
  document.getElementById('btnExport').addEventListener('click',onExport);
  document.getElementById('btnImport').addEventListener('click',onImport);
  document.getElementById('importFile').addEventListener('change',handleImportFile);
  document.getElementById('recipeBack').addEventListener('click',function(){showView('orders');});
  document.getElementById('navCalc').addEventListener('click',function(){showView('calc');});
  document.getElementById('navOrders').addEventListener('click',function(){closeOverlays();renderOrders();showView('orders');});
}
init();
</script>
