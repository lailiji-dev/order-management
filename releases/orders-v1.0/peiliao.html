<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生产配料计算系统</title>
<style>
  /* ============ 设计 Token ============ */
  :root{
    /* 主色：食品厂清新绿 */
    --green-50:#EAF5EA;  --green-100:#CDE9CD; --green-200:#A5D6A7;
    --green-400:#43A047; --green-500:#2E7D32; --green-600:#268A2B;
    --green-700:#1B5E20; --green-800:#144A18;
    /* 强调：暖橙（用于原料汇总） */
    --amber-50:#FFF3E0; --amber-400:#FB8C00; --amber-500:#F57C00; --amber-600:#E65100;
    /* 中性 / 语义 */
    --bg:#F3F6F2; --surface:#FFFFFF; --surface-2:#F7FAF6;
    --text:#1E2A20; --text-2:#3C4A40; --muted:#586A5C;
    --line:#E4E9E2; --line-strong:#D3DBD3;
    --danger:#C62828; --danger-bg:#FDECEC; --danger-soft:#FBE3E3;
    /* 圆角 / 阴影 / 间距（8px 基线） */
    --r-sm:10px; --r:14px; --r-lg:18px;
    --sh-sm:0 1px 2px rgba(16,40,20,.06),0 1px 3px rgba(16,40,20,.05);
    --sh:0 2px 6px rgba(16,40,20,.07),0 1px 2px rgba(16,40,20,.04);
    --sh-lg:0 10px 28px rgba(16,40,20,.14);
    --sp:8px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.55;
    padding-bottom:84px;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;}
  .hidden{display:none !important;}

  /* 焦点可见性（无障碍） */
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
    outline:3px solid var(--green-200);outline-offset:2px;border-radius:6px;
  }

  /* ============ 顶部标题 ============ */
  .app-header{
    background:linear-gradient(135deg,var(--green-500),var(--green-700));
    color:#fff;padding:16px 18px;position:sticky;top:0;z-index:20;
    box-shadow:0 3px 10px rgba(16,40,20,.18);
    display:flex;align-items:center;gap:12px;
  }
  .app-header .logo{
    width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;
  }
  .app-header .ht{display:flex;flex-direction:column;line-height:1.2;}
  .app-header h1{font-size:18px;font-weight:700;letter-spacing:.5px;}
  .app-header .sub{font-size:12px;opacity:.85;margin-top:2px;}

  /* ============ 视图容器 ============ */
  .view{max-width:880px;margin:0 auto;padding:14px 14px 8px;}

  /* 计划页头 */
  .plan-header{
    background:linear-gradient(180deg,#fff,#FBFDF9);
    border:1px solid var(--line);border-left:5px solid var(--green-500);
    border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh);
  }
  .plan-title{font-size:20px;font-weight:800;letter-spacing:.5px;}
  .plan-date{margin-top:2px;color:var(--muted);font-size:14px;}
  .plan-summary{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong);
    font-size:13px;color:var(--text-2);
  }
  .plan-summary b{color:var(--green-700);font-size:15px;}
  .ps-hint{color:var(--muted);}

  /* ============ 分类区（可折叠 + 平滑动画） ============ */
  .cat-section{margin-bottom:12px;}
  .cat-header{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;
    box-shadow:var(--sh-sm);user-select:none;transition:background .15s,border-color .15s;
  }
  .cat-header:active{background:var(--surface-2);}
  .cat-arrow{
    color:var(--green-500);font-size:12px;width:16px;text-align:center;
    transition:transform .25s ease;flex:0 0 auto;
  }
  .cat-section.collapsed .cat-arrow{transform:rotate(-90deg);}
  .cat-name{font-weight:800;font-size:16px;flex:1;}
  .cat-count{
    background:var(--green-50);color:var(--green-700);font-weight:700;font-size:12px;
    padding:2px 10px;border-radius:20px;flex:0 0 auto;
  }
  .cat-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s ease;}
  .cat-section.collapsed .cat-body{grid-template-rows:0fr;}
  .cat-inner{overflow:hidden;display:flex;flex-direction:column;gap:8px;padding-top:8px;}

  /* 产品输入卡片 */
  .prod-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px;box-shadow:var(--sh-sm);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    transition:box-shadow .15s,transform .15s,border-color .15s;
  }
  .prod-card:focus-within{border-color:var(--green-200);box-shadow:var(--sh);}
  .prod-name{font-weight:700;font-size:16px;flex:0 0 auto;}
  .prod-input-row{display:flex;align-items:center;gap:10px;}
  .prod-label{color:var(--muted);font-size:13px;white-space:nowrap;}
  .qty-box{
    display:flex;align-items:center;background:var(--surface-2);
    border:2px solid var(--line-strong);border-radius:12px;padding:4px 6px 4px 14px;
    transition:border-color .15s,background .15s;
  }
  .qty-box:focus-within{border-color:var(--green-400);background:#fff;}
  .qty-input{
    border:none;background:transparent;font-size:24px;font-weight:800;width:100px;
    text-align:right;color:var(--text);outline:none;
  }
  .qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .qty-input[type=number]{-moz-appearance:textfield;}
  .unit-suffix{color:var(--green-600);font-weight:800;font-size:15px;margin:0 6px 0 2px;}
  .clear-btn{
    border:none;background:var(--danger-soft);color:var(--danger);width:32px;height:32px;
    border-radius:9px;font-size:20px;line-height:1;cursor:pointer;flex:0 0 auto;
    transition:background .15s,transform .1s;
  }
  .clear-btn:hover{background:#F8C9C9;}
  .clear-btn:active{transform:scale(.9);}

  /* ============ 操作按钮区 ============ */
  .action-bar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px;}
  .btn{
    border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;
    cursor:pointer;transition:transform .12s ease,box-shadow .15s ease,filter .15s ease,background .15s;
    flex:1 1 auto;min-width:118px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn-primary{
    background:linear-gradient(135deg,var(--green-500),var(--green-700));color:#fff;
    font-size:17px;padding:15px 18px;box-shadow:0 4px 12px rgba(46,125,50,.35);flex-basis:100%;
  }
  .btn-primary:hover{box-shadow:0 6px 16px rgba(46,125,50,.42);}
  .btn-secondary{background:#fff;color:var(--green-700);border:2px solid var(--green-200);}
  .btn-secondary:hover{background:var(--green-50);}
  .btn-ghost{background:#EEF2EC;color:var(--text-2);}
  .btn-ghost:hover{background:#E4EAE2;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#B71C1C;}
  .btn-danger.sm,.btn-secondary.sm{padding:7px 12px;font-size:13px;min-width:auto;flex:0 0 auto;}
  .divider{width:100%;height:1px;background:var(--line);margin:4px 0;}

  /* ============ 结果区 ============ */
  .result-block{margin-top:18px;animation:fadeUp .3s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .result-title{
    font-size:18px;font-weight:800;color:var(--green-700);margin:0 0 10px;
    border-left:5px solid var(--amber-500);padding-left:10px;
  }
  .detail-card,.summary-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh);
  }
  .detail-card{border-left:5px solid var(--green-400);}
  .detail-head{font-size:17px;font-weight:800;color:var(--green-700);}
  .detail-meta{color:var(--muted);font-size:13px;margin:4px 0 10px;}
  .detail-empty,.empty-tip{color:var(--muted);font-size:14px;padding:8px 0;}
  .detail-materials,.summary-card{display:flex;flex-direction:column;gap:2px;}
  .mat-line,.sum-line{
    display:flex;align-items:baseline;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line);
  }
  .mat-line:last-child,.sum-line:last-child{border-bottom:none;}
  .mat-name{flex:1;font-weight:600;}
  .mat-amt{font-weight:800;font-size:16px;color:var(--text);white-space:nowrap;}
  .mat-theory{color:var(--muted);font-size:12px;white-space:nowrap;}

  /* 汇总卡高亮 */
  .summary-card{border-left:5px solid var(--amber-500);background:linear-gradient(180deg,#FFFDF8,#FFF6E9);}
  .summary-card .sum-line .mat-amt{color:var(--amber-600);font-size:17px;}
  .sum-total{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:6px;padding-top:10px;border-top:2px solid var(--amber-200);
    font-weight:800;color:var(--amber-700);
  }

  /* ============ 底部导航 ============ */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;height:66px;background:rgba(255,255,255,.96);
    backdrop-filter:blur(8px);display:flex;border-top:1px solid var(--line);z-index:30;
    box-shadow:0 -2px 10px rgba(16,40,20,.07);
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;
    border:none;background:none;position:relative;transition:color .15s;
  }
  .nav-item .nav-ico{font-size:21px;line-height:1;transition:transform .15s;}
  .nav-item.active{color:var(--green-600);}
  .nav-item.active .nav-ico{transform:translateY(-1px) scale(1.06);}
  .nav-item.active::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--green-500);
  }

  /* ============ 订单占位 ============ */
  .orders-placeholder{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:48px 20px;text-align:center;box-shadow:var(--sh);margin-top:18px;
  }
  .orders-placeholder h2{margin:0 0 14px;color:var(--green-700);font-size:20px;}
  .dev-tip{display:inline-block;background:var(--amber-50);color:var(--amber-600);
    font-weight:800;padding:7px 18px;border-radius:20px;margin:0 0 14px;}
  .muted{color:var(--muted);font-size:14px;}

  /* ============ 配方管理 ============ */
  #view-recipe{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;}
  .recipe-top{
    background:linear-gradient(135deg,var(--green-500),var(--green-700));color:#fff;
    padding:13px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;
    box-shadow:0 3px 10px rgba(16,40,20,.18);
  }
  .recipe-top h2{font-size:17px;font-weight:700;flex:1;}
  .recipe-back{
    border:none;background:rgba(255,255,255,.18);color:#fff;font-weight:700;
    padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;transition:background .15s;
  }
  .recipe-back:hover{background:rgba(255,255,255,.28);}
  .recipe-body{max-width:880px;margin:0 auto;padding:16px 14px 30px;}
  .recipe-section{margin-bottom:24px;}
  .sec-title{
    font-size:16px;font-weight:800;color:var(--green-700);margin:0 0 12px;
    border-left:5px solid var(--amber-500);padding-left:10px;
  }
  .cat-manage-card,.prod-edit-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh-sm);
  }
  .prod-edit-card{border-top:3px solid var(--green-400);}
  .field-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .field-row label{color:var(--muted);font-size:13px;white-space:nowrap;font-weight:600;}
  .field-row input,.p-name,.cat-name-input,.m-name,.m-amt,
  select,.p-cat,.p-loss,.m-unit{
    border:2px solid var(--line-strong);border-radius:9px;padding:9px 11px;font-size:15px;
    outline:none;background:var(--surface-2);color:var(--text);transition:border-color .15s,background .15s;
  }
  .field-row input:focus,.p-name:focus,.cat-name-input:focus,.m-name:focus,.m-amt:focus,
  select:focus,.p-cat:focus,.p-loss:focus,.m-unit:focus{border-color:var(--green-400);background:#fff;}
  .cat-name-input{flex:1;min-width:140px;font-weight:700;}
  .p-name{flex:1;min-width:160px;font-weight:700;}
  .mini-qty{display:flex;align-items:center;gap:4px;}
  .mini-qty input{width:84px;}
  .cat-sub{color:var(--muted);font-size:13px;margin:6px 0;}
  .cat-group{margin-bottom:18px;}
  .cat-group-head{
    font-weight:800;font-size:15px;color:var(--green-700);margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-bottom:6px;border-bottom:2px solid var(--green-100);
  }
  .recipe-head{
    font-weight:800;font-size:14px;color:var(--text-2);margin:12px 0 8px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .mat-list{display:flex;flex-direction:column;gap:6px;}
  .mat-edit-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .mat-edit-row .m-name{flex:1;min-width:120px;}
  .mat-edit-row .m-amt{width:92px;}

  /* ============ 打印 ============ */
  #printArea{display:none;}
  @media print{
    body{padding-bottom:0;background:#fff;}
    .app-header,.bottom-nav,.action-bar,#view-calc,#view-orders,#view-recipe{display:none !important;}
    #printArea{display:block !important;padding:10px 16px;max-width:100%;}
    .print-title{text-align:center;font-size:22px;margin:0 0 6px;}
    .print-date{text-align:center;margin-bottom:14px;}
    .print-sub{font-size:17px;border-bottom:2px solid #000;padding-bottom:4px;margin:16px 0 8px;}
    .print-plan div{padding:3px 0;}
    .print-sheet .result-title{font-size:17px;}
    .detail-card,.summary-card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
    hr{border:none;border-top:1px solid #999;}
  }

  /* 减少动效（无障碍） */
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }

  /* 桌面端微调 */
  @media (min-width:768px){
    .prod-card:hover{box-shadow:var(--sh);transform:translateY(-1px);}
    .qty-input{width:120px;}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">🍡</div>
  <div class="ht">
    <h1>生产配料计算系统</h1>
    <span class="sub">食品厂生产配料 · 按「个」核算</span>
  </div>
</header>

<!-- 配比计算视图 -->
<main id="view-calc" class="view">
  <div class="plan-header">
    <div class="plan-title">今日生产计划</div>
    <div class="plan-date" id="todayDate"></div>
    <div class="plan-summary" id="planSummary"></div>
  </div>

  <div id="categoryList"></div>

  <div class="action-bar">
    <button class="btn btn-primary" id="btnCalc">🧮 计算今日配料</button>
    <button class="btn btn-ghost" id="btnClear">清空今日计划</button>
    <button class="btn btn-ghost" id="btnPrint">🖨 打印配料单</button>
    <div class="divider"></div>
    <button class="btn btn-secondary" id="btnRecipe">⚙ 配方管理</button>
    <button class="btn btn-ghost" id="btnExport">⬇ 导出数据</button>
    <button class="btn btn-ghost" id="btnImport">⬆ 导入数据</button>
  </div>

  <div id="resultArea"></div>
</main>

<!-- 订单视图 -->
<main id="view-orders" class="view hidden">
  <div class="orders-placeholder">
    <h2>订单管理</h2>
    <div class="dev-tip">功能开发中</div>
    <p class="muted">订单模块完成后，订单数量将自动同步到「配比计算」。</p>
  </div>
</main>

<!-- 配方管理视图 -->
<div id="view-recipe" class="hidden">
  <div class="recipe-top">
    <button class="recipe-back" id="recipeBack">← 返回</button>
    <h2>配方管理</h2>
  </div>
  <div class="recipe-body" id="recipeContent"></div>
</div>

<!-- 底部导航 -->
<nav class="bottom-nav">
  <button class="nav-item" id="navOrders">
    <span class="nav-ico">📋</span><span>订单</span>
  </button>
  <button class="nav-item active" id="navCalc">
    <span class="nav-ico">🧮</span><span>配比计算</span>
  </button>
</nav>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<!-- 打印专用区域 -->
<div id="printArea"></div>

<script>
"use strict";

/* ============ 基础工具 ============ */
function genId(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function todayStr(){
  var d=new Date();
  var m=String(d.getMonth()+1).padStart(2,'0');
  var day=String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}
function todayDateText(){
  var d=new Date();
  var wd=['日','一','二','三','四','五','六'][d.getDay()];
  return todayStr()+'　星期'+wd;
}
// 数字格式化：原料最多3位小数，去除多余0
function fmtKg(n){
  var r=Math.round((Number(n)+Number.EPSILON)*1000)/1000;
  return r.toString();
}
function fmtCount(n){
  return Math.round(Number(n)).toString();
}
function toKg(amount,unit){
  amount=parseFloat(amount)||0;
  return unit==='g' ? amount/1000 : amount;
}

/* ============ 默认数据 ============ */
var DEFAULT_DATA={
  categories:[
    {id:'c1',name:'煎堆'},
    {id:'c2',name:'糍粑'},
    {id:'c3',name:'饼类'},
    {id:'c4',name:'蛋糕类'},
    {id:'c5',name:'生粉'}
  ],
  products:[
    {id:'p1',name:'小煎堆',categoryId:'c1',standardYield:500,lossRate:0,recipe:[]},
    {id:'p2',name:'糖煎堆',categoryId:'c1',standardYield:400,lossRate:0,recipe:[]},
    {id:'p3',name:'味煎堆',categoryId:'c1',standardYield:500,lossRate:0,recipe:[]},
    {id:'p4',name:'芝麻煎堆',categoryId:'c1',standardYield:350,lossRate:0,recipe:[]},
    {id:'p5',name:'特大煎堆',categoryId:'c1',standardYield:200,lossRate:0,recipe:[]},
    {id:'p6',name:'莲蓉煎堆',categoryId:'c1',standardYield:300,lossRate:0,recipe:[]},
    {id:'p7',name:'糖糍粑',categoryId:'c2',standardYield:500,lossRate:0,recipe:[]},
    {id:'p8',name:'味糍粑',categoryId:'c2',standardYield:500,lossRate:0,recipe:[]},
    {id:'p9',name:'双喜饼',categoryId:'c3',standardYield:300,lossRate:0,recipe:[]},
    {id:'p10',name:'大饼',categoryId:'c3',standardYield:200,lossRate:0,recipe:[]},
    {id:'p11',name:'蛋糕仔',categoryId:'c4',standardYield:300,lossRate:0,recipe:[]},
    {id:'p12',name:'三色大生粉',categoryId:'c5',standardYield:200,lossRate:0,recipe:[]},
    {id:'p13',name:'双色大生粉',categoryId:'c5',standardYield:200,lossRate:0,recipe:[]},
    {id:'p14',name:'小生粉',categoryId:'c5',standardYield:200,lossRate:0,recipe:[]}
  ],
  todayPlan:{}
};

var LS_KEY='peiliao_data_v1';
var LS_PLAN_DATE='peiliao_plan_date_v1';
var state=loadData();

function loadData(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d&&d.categories&&d.products){
        if(!d.todayPlan) d.todayPlan={};
        return d;
      }
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){ alert('保存失败：'+e.message); }
}

/* ============ 视图切换 ============ */
function showView(name){
  document.getElementById('view-calc').classList.toggle('hidden',name!=='calc');
  document.getElementById('view-orders').classList.toggle('hidden',name!=='orders');
  document.getElementById('view-recipe').classList.toggle('hidden',name!=='recipe');
  document.getElementById('navCalc').classList.toggle('active',name==='calc'||name==='recipe');
  document.getElementById('navOrders').classList.toggle('active',name==='orders');
  window.scrollTo(0,0);
}

/* ============ 渲染生产计划 ============ */
function renderDate(){ document.getElementById('todayDate').textContent='日期：'+todayDateText(); }

function updatePlanSummary(){
  var plan=state.todayPlan||{};
  var cnt=0,total=0;
  Object.keys(plan).forEach(function(id){
    var v=parseFloat(plan[id]);
    if(v>0){ cnt++; total+=v; }
  });
  var el=document.getElementById('planSummary');
  if(!el) return;
  if(cnt===0) el.innerHTML='<span class="ps-hint">尚未录入今日生产数量</span>';
  else el.innerHTML='已录入 <b>'+cnt+'</b> 种产品 · 今日合计 <b>'+fmtCount(total)+'</b> 个';
}

function renderPlan(){
  var wrap=document.getElementById('categoryList');
  wrap.innerHTML='';
  var isMobile=window.matchMedia('(max-width:768px)').matches;
  state.categories.forEach(function(cat){
    var prods=state.products.filter(function(p){return p.categoryId===cat.id;});
    if(prods.length===0) return;
    var section=document.createElement('div');
    section.className='cat-section'+(isMobile?' collapsed':'');

    var header=document.createElement('div');
    header.className='cat-header';
    header.innerHTML='<span class="cat-arrow">▼</span><span class="cat-name">'+escapeHtml(cat.name)+
      '</span><span class="cat-count">'+prods.length+'</span>';
    var body=document.createElement('div');
    body.className='cat-body';
    var inner=document.createElement('div');
    inner.className='cat-inner';
    prods.forEach(function(p){ inner.appendChild(buildProductInputCard(p)); });
    body.appendChild(inner);

    header.addEventListener('click',function(){ section.classList.toggle('collapsed'); });

    section.appendChild(header);
    section.appendChild(body);
    wrap.appendChild(section);
  });
  updatePlanSummary();
}

function buildProductInputCard(p){
  var card=document.createElement('div');
  card.className='prod-card';
  var val=state.todayPlan[p.id]||'';
  card.innerHTML=
    '<div class="prod-name">'+escapeHtml(p.name)+'</div>'+
    '<div class="prod-input-row">'+
      '<span class="prod-label">今日计划</span>'+
      '<div class="qty-box">'+
        '<input type="number" inputmode="decimal" min="0" step="1" class="qty-input" data-id="'+p.id+'" value="'+escapeHtml(val)+'" placeholder="0">'+
        '<span class="unit-suffix">个</span>'+
        '<button class="clear-btn" data-id="'+p.id+'" title="清空" aria-label="清空">×</button>'+
      '</div>'+
    '</div>';
  var input=card.querySelector('.qty-input');
  input.addEventListener('input',function(e){
    var v=e.target.value;
    if(v===''||parseFloat(v)<=0) delete state.todayPlan[p.id];
    else state.todayPlan[p.id]=v;
    saveData();
    updatePlanSummary();
  });
  card.querySelector('.clear-btn').addEventListener('click',function(){
    delete state.todayPlan[p.id];
    input.value='';
    saveData();
    updatePlanSummary();
  });
  return card;
}

/* ============ 计算逻辑 ============ */
function calculate(){
  var plan=state.todayPlan||{};
  var results=[];
  var summary={};
  var hasPlan=false;
  state.products.forEach(function(p){
    var qty=parseFloat(plan[p.id]);
    if(!qty||qty<=0) return;
    hasPlan=true;
    var yield_=parseFloat(p.standardYield)||0;
    var ratio = yield_>0 ? qty/yield_ : 0;
    var materials=[];
    (p.recipe||[]).forEach(function(m){
      var nm=(m.name||'').trim();
      if(!nm) return;
      var stdKg=toKg(m.amount,m.unit);
      var theoryKg=stdKg*ratio;
      var loss=(parseFloat(p.lossRate)||0)/100;
      var actualKg=theoryKg*(1+loss);
      materials.push({name:nm,theoryKg:theoryKg,actualKg:actualKg,lossApplied:loss>0});
      if(!summary[nm]) summary[nm]={theory:0,actual:0};
      summary[nm].theory+=theoryKg;
      summary[nm].actual+=actualKg;
    });
    results.push({product:p,qty:qty,ratio:ratio,materials:materials,lossRate:parseFloat(p.lossRate)||0,noYield:yield_<=0});
  });
  return {results:results,summary:summary,hasPlan:hasPlan};
}

function buildResultHTML(r){
  if(!r.hasPlan) return '<div class="empty-tip">📭 请在上方输入今日各产品的生产数量，然后点击「计算今日配料」。</div>';
  var html='<div class="result-block"><h2 class="result-title">今日产品配料明细</h2>';
  r.results.forEach(function(item){
    html+='<div class="detail-card">'+
      '<div class="detail-head">'+escapeHtml(item.product.name)+'</div>'+
      '<div class="detail-meta">计划生产：'+fmtCount(item.qty)+' 个　|　配方倍率：'+fmtKg(item.ratio)+'</div>';
    if(item.noYield){
      html+='<div class="detail-empty">（该产品的「标准产量」未设置，无法计算，请在配方管理中设置）</div>';
    }else if(item.materials.length===0){
      html+='<div class="detail-empty">（暂未设置配方，请在「配方管理」中录入原料）</div>';
    }else{
      html+='<div class="detail-materials">';
      item.materials.forEach(function(m){
        html+='<div class="mat-line"><span class="mat-name">'+escapeHtml(m.name)+'</span>'+
          '<span class="mat-amt">'+fmtKg(m.actualKg)+' kg</span>';
        if(m.lossApplied) html+='<span class="mat-theory">（理论 '+fmtKg(m.theoryKg)+' kg）</span>';
        html+='</div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  html+='</div>';

  var names=Object.keys(r.summary);
  if(names.length>0){
    var hasLoss=r.results.some(function(it){return it.lossRate>0;});
    html+='<div class="result-block"><h2 class="result-title">今日原料总需求</h2><div class="summary-card">';
    var totalTheory=0,totalActual=0;
    names.forEach(function(name){
      var s=r.summary[name];
      totalTheory+=s.theory; totalActual+=s.actual;
      html+='<div class="sum-line"><span class="mat-name">'+escapeHtml(name)+'</span>'+
        '<span class="mat-amt">'+fmtKg(s.actual)+' kg</span>';
      if(hasLoss) html+='<span class="mat-theory">（理论 '+fmtKg(s.theory)+' kg）</span>';
      html+='</div>';
    });
    html+='<div class="sum-total"><span>原料合计（'+names.length+' 种）</span><span>'+fmtKg(totalActual)+' kg</span></div>';
    html+='</div></div>';
  }else{
    html+='<div class="empty-tip">暂无可用配方数据，无法汇总原料。</div>';
  }
  return html;
}

function buildPrintHTML(r){
  var html='<div class="print-sheet">'+
    '<h1 class="print-title">生产配料单</h1>'+
    '<div class="print-date">生产日期：'+todayDateText()+'</div>'+
    '<div class="print-sub">今日生产计划</div><div class="print-plan">';
  r.results.forEach(function(it){
    html+='<div>'+escapeHtml(it.product.name)+'　'+fmtCount(it.qty)+' 个</div>';
  });
  html+='</div><hr>';
  html+=buildResultHTML(r);
  html+='</div>';
  return html;
}

function onCalculate(){
  var r=calculate();
  document.getElementById('resultArea').innerHTML=buildResultHTML(r);
  document.getElementById('printArea').innerHTML=buildPrintHTML(r);
  document.getElementById('resultArea').scrollIntoView({behavior:'smooth',block:'start'});
}
function onClear(){
  if(!confirm('确定清空今日所有产品的生产数量吗？')) return;
  state.todayPlan={};
  saveData();
  renderPlan();
  document.getElementById('resultArea').innerHTML='';
}
function onPrint(){
  var r=calculate();
  if(!r.hasPlan){ alert('请先输入今日生产数量，并点击「计算今日配料」。'); return; }
  document.getElementById('printArea').innerHTML=buildPrintHTML(r);
  window.print();
}
function onExport(){
  var data=JSON.stringify(state,null,2);
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='配料系统备份_'+todayStr()+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function onImport(){
  document.getElementById('importFile').click();
}
function handleImportFile(e){
  var file=e.target.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=JSON.parse(reader.result);
      if(!d||!d.categories||!d.products) throw new Error('文件格式不正确');
      d.todayPlan=d.todayPlan||{};
      state=d;
      saveData();
      localStorage.setItem(LS_PLAN_DATE,todayStr());
      renderPlan();
      renderRecipe();
      updatePlanSummary();
      alert('数据导入成功！');
    }catch(err){
      alert('导入失败：'+err.message);
    }
    e.target.value='';
  };
  reader.readAsText(file);
}

/* ============ 配方管理 ============ */
function openRecipe(){
  if(confirm('配方数据会影响生产计算，请确认是否进入配方管理。')){
    renderRecipe();
    showView('recipe');
  }
}

function renderRecipe(){
  var root=document.getElementById('recipeContent');
  var html='<div class="recipe-section"><h3 class="sec-title">产品分类管理</h3>';
  html+='<button class="btn btn-secondary" data-act="addCat">+ 新增分类</button>';
  state.categories.forEach(function(cat){
    var cnt=state.products.filter(function(p){return p.categoryId===cat.id;}).length;
    html+='<div class="cat-manage-card">'+
      '<div class="field-row">'+
        '<label>分类名称</label>'+
        '<input class="cat-name-input" data-cat="'+cat.id+'" value="'+escapeHtml(cat.name)+'">'+
        '<button class="btn btn-danger sm" data-act="delCat" data-cat="'+cat.id+'">删除分类</button>'+
      '</div>'+
      '<div class="cat-sub">含 '+cnt+' 个产品</div>'+
    '</div>';
  });
  html+='</div>';

  html+='<div class="recipe-section"><h3 class="sec-title">产品与配方</h3>';
  state.categories.forEach(function(cat){
    var prods=state.products.filter(function(p){return p.categoryId===cat.id;});
    html+='<div class="cat-group"><div class="cat-group-head"><span>'+escapeHtml(cat.name)+'</span>'+
      '<button class="btn btn-secondary sm" data-act="addProd" data-cat="'+cat.id+'">+ 新增产品</button></div>';
    if(prods.length===0) html+='<div class="cat-sub">（暂无产品）</div>';
    prods.forEach(function(p){ html+=buildProductEditCard(p); });
    html+='</div>';
  });
  html+='</div>';
  root.innerHTML=html;
}

function buildProductEditCard(p){
  var catOptions=state.categories.map(function(c){
    return '<option value="'+c.id+'"'+(c.id===p.categoryId?' selected':'')+'>'+escapeHtml(c.name)+'</option>';
  }).join('');
  var lossOptions=[0,1,2,3,5,8,10].map(function(v){
    return '<option value="'+v+'"'+(v===p.lossRate?' selected':'')+'>'+v+'%</option>';
  }).join('');
  var matHtml='';
  (p.recipe||[]).forEach(function(m,i){
    matHtml+='<div class="mat-edit-row">'+
      '<input class="m-name" data-prod="'+p.id+'" data-mat="'+i+'" data-f="name" value="'+escapeHtml(m.name)+'" placeholder="原料名称">'+
      '<input class="m-amt" type="number" inputmode="decimal" min="0" step="0.1" data-prod="'+p.id+'" data-mat="'+i+'" data-f="amount" value="'+escapeHtml(m.amount)+'">'+
      '<select class="m-unit" data-prod="'+p.id+'" data-mat="'+i+'" data-f="unit">'+
        '<option value="kg"'+(m.unit==='kg'?' selected':'')+'>kg</option>'+
        '<option value="g"'+(m.unit==='g'?' selected':'')+'>g</option>'+
      '</select>'+
      '<button class="btn btn-danger sm" data-act="delMat" data-prod="'+p.id+'" data-mat="'+i+'">删</button>'+
    '</div>';
  });
  return '<div class="prod-edit-card">'+
    '<div class="field-row"><label>产品名称</label>'+
      '<input class="p-name" data-prod="'+p.id+'" data-f="name" value="'+escapeHtml(p.name)+'"></div>'+
    '<div class="field-row"><label>所属分类</label>'+
      '<select class="p-cat" data-prod="'+p.id+'" data-f="cat">'+catOptions+'</select>'+
      '<label>标准产量</label>'+
      '<div class="mini-qty"><input type="number" min="0" step="1" data-prod="'+p.id+'" data-f="yield" value="'+escapeHtml(p.standardYield)+'"><span>个</span></div>'+
      '<label>损耗率</label>'+
      '<select class="p-loss" data-prod="'+p.id+'" data-f="loss">'+lossOptions+'</select></div>'+
    '<div class="recipe-head"><span>配方原料</span><button class="btn btn-secondary sm" data-act="addMat" data-prod="'+p.id+'">+ 新增原料</button></div>'+
    '<div class="mat-list">'+(matHtml||'<div class="cat-sub">（暂无原料，点击上方新增）</div>')+'</div>'+
    '<div style="margin-top:10px;"><button class="btn btn-danger sm" data-act="delProd" data-prod="'+p.id+'">删除该产品</button></div>'+
  '</div>';
}

function findProd(id){ return state.products.find(function(p){return p.id===id;}); }

function attachRecipeListeners(){
  var root=document.getElementById('recipeContent');

  // 输入/选择事件（事件委托，只绑定一次）
  function onField(e){
    var el=e.target;
    var prodId=el.dataset.prod, matIdx=el.dataset.mat, f=el.dataset.f;
    if(!prodId||!f) return;
    var p=findProd(prodId); if(!p) return;
    if(matIdx!==undefined){
      var m=p.recipe[parseInt(matIdx,10)];
      if(!m) return;
      if(f==='name') m.name=el.value;
      else if(f==='amount') m.amount=parseFloat(el.value)||0;
      else if(f==='unit') m.unit=el.value;
      saveData();
      return;
    }
    if(f==='name') p.name=el.value;
    else if(f==='yield') p.standardYield=parseFloat(el.value)||0;
    else if(f==='loss') p.lossRate=parseFloat(el.value)||0;
    else if(f==='cat'){
      p.categoryId=el.value; saveData();
      if(e.type==='change') renderRecipe(); // 分类变更需重排
      return;
    }
    saveData();
  }
  root.addEventListener('input',onField);
  root.addEventListener('change',onField);

  // 分类名称变更
  root.addEventListener('input',function(e){
    var inp=e.target;
    if(inp.classList.contains('cat-name-input')){
      var cat=state.categories.find(function(c){return c.id===inp.dataset.cat;});
      if(cat){ cat.name=inp.value; saveData(); }
    }
  });

  // 点击操作
  root.addEventListener('click',function(e){
    var btn=e.target.closest('[data-act]');
    if(!btn) return;
    var act=btn.dataset.act;
    if(act==='addCat'){
      var name=prompt('请输入新分类名称：','新分类');
      if(name&&name.trim()){ state.categories.push({id:genId(),name:name.trim()}); saveData(); renderRecipe(); }
    }else if(act==='delCat'){
      var catId=btn.dataset.cat;
      var cnt=state.products.filter(function(p){return p.categoryId===catId;}).length;
      var msg='确定删除该分类吗？';
      if(cnt>0) msg='该分类下有 '+cnt+' 个产品，删除后这些产品也会一并删除。确定？';
      if(confirm(msg)){
        state.products=state.products.filter(function(p){return p.categoryId!==catId;});
        state.categories=state.categories.filter(function(c){return c.id!==catId;});
        saveData(); renderRecipe();
      }
    }else if(act==='addProd'){
      var cid=btn.dataset.cat;
      state.products.push({id:genId(),name:'新商品',categoryId:cid,standardYield:500,lossRate:0,recipe:[]});
      saveData(); renderRecipe();
    }else if(act==='delProd'){
      var pid=btn.dataset.prod;
      if(confirm('确定删除该产品吗？删除后其配方将丢失。')){
        state.products=state.products.filter(function(p){return p.id!==pid;});
        delete state.todayPlan[pid];
        saveData(); renderRecipe();
      }
    }else if(act==='addMat'){
      var pp=findProd(btn.dataset.prod);
      pp.recipe.push({name:'',amount:0,unit:'kg'});
      saveData(); renderRecipe();
    }else if(act==='delMat'){
      var pr=findProd(btn.dataset.prod);
      pr.recipe.splice(parseInt(btn.dataset.mat,10),1);
      saveData(); renderRecipe();
    }
  });
}

/* ============ 初始化 ============ */
function init(){
  // 每天自动重置当日计划
  var pd=localStorage.getItem(LS_PLAN_DATE);
  var today=todayStr();
  if(pd!==today){
    state.todayPlan={};
    saveData();
    localStorage.setItem(LS_PLAN_DATE,today);
  }
  if(!state.todayPlan) state.todayPlan={};

  renderDate();
  renderPlan();
  attachRecipeListeners();
  showView('calc');

  // 绑定按钮
  document.getElementById('btnCalc').addEventListener('click',onCalculate);
  document.getElementById('btnClear').addEventListener('click',onClear);
  document.getElementById('btnPrint').addEventListener('click',onPrint);
  document.getElementById('btnRecipe').addEventListener('click',openRecipe);
  document.getElementById('btnExport').addEventListener('click',onExport);
  document.getElementById('btnImport').addEventListener('click',onImport);
  document.getElementById('importFile').addEventListener('change',handleImportFile);
  document.getElementById('recipeBack').addEventListener('click',function(){ showView('calc'); });
  document.getElementById('navCalc').addEventListener('click',function(){ showView('calc'); });
  document.getElementById('navOrders').addEventListener('click',function(){ showView('orders'); });
}

init();
</script>
